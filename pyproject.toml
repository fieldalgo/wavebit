[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "fieldwave"
version = "0.1.0"
description = "Electromagnetic simulation (RCWA) & optimization package in Python"
readme = "README.md"
license = "Apache-2.0"
authors = [{ name = "FieldAlgo", email = "dev@fieldalgo.com" }]

# Driven by the base install alone, not by the optional backends: jax 0.11 also needs
# 3.12, but pip enforces that from jax's own metadata when the extra is requested, so
# it is not what sets this. The binding constraints are the numpy and scipy floors
# below -- numpy 2.5.1 and scipy 1.18 both declare Requires-Python >=3.12, and
# array-api-compat 1.15 still declares >=3.10, so it does not bind.
#
# This said >=3.10 until the numpy/scipy floors were raised past it, which made the
# declaration unsatisfiable rather than merely generous: on 3.10 the newest numpy pip
# will consider is 2.2.6, so `pip install fieldwave` failed at resolution with "No
# matching distribution found for numpy>=2.5.1". Keep this in step with those floors --
# the `minimal` CI job runs on every version listed here, which is what caught it.
requires-python = ">=3.12"

# Floors are the versions the suite is actually verified against, not the oldest that
# might happen to work. That rule is applied literally to the numerical stack -- numpy,
# scipy, array-api-compat, jax, torch -- whose exact versions the frozen goldens are
# pinned against; each floor below is a version the full suite has been run on, and
# nothing between it and the previous floor is claimed. Loosening a floor later is safe
# and cheap; tightening one after a release is not, so they start strict. `tqdm` and
# `optax` are exempt: neither touches a number the goldens cover.
#
# History behind the numpy floor, which now sits well above it: NumPy 2.2.x and 2.3.0
# have a bug in the complex `matmul` FP-status check, where an ordinary complex matrix
# product raises a cascade of `RuntimeWarning: overflow / divide by zero / invalid value
# encountered in matmul` on values nowhere near overflow -- measured here on a
# convolution matrix with condition number 12 whose largest entry was 2.1. A single 2D
# solve emitted 456 of them. The values were never affected (energy conserved to ~1e-14,
# and the results are bit-identical across versions); only the reporting was. 2.3.1 fixed
# it, and was the floor until the floors were aligned with what is actually verified.
dependencies = [
    "numpy>=2.5.1",
    "scipy>=1.18",
    "array-api-compat>=1.15",
]

[project.optional-dependencies]
# The jax floor is a hard requirement on top of the verification rule, not just a record:
# _core/backend.py calls jax.lax.linalg.eig(enable_eigvec_derivs=True), which does not
# exist before 0.11 -- an older jax installs fine and then fails at the first
# eigendecomposition.
jax = [
    "jax>=0.11",
    "jaxlib>=0.11",
    "optax>=0.2",
    "tqdm>=4.67",
]

# 2.13, not 2.7, because 2.7 cannot compile this solver: `torch.compile` dies with
# `InternalTorchDynamoError` on every path, from four separate PyTorch defects -- a
# `torch._numpy` shim missing `np._CopyMode`, an Inductor meta kernel that declares
# row-major eigenvectors where LAPACK returns column-major, a Dynamo resume-bytecode
# failure on cell variables, and a complex-view stride error in the backward pass. All
# four are gone by 2.13, where the suite is green. Eager and autograd work on 2.7, so this
# floor is about matching the version the suite is verified against, not about enabling
# `torch.compile` -- which is not worth using either way; see docs/torch-compile.md.
# Versions between 2.8 and 2.12 were not tested.
pytorch = [
    "torch>=2.13",
    "tqdm>=4.67",
]

[project.urls]
Homepage = "https://github.com/fieldalgo/fieldwave"

[tool.setuptools.packages.find]
include = ["fieldwave*"]

# Refractive-index tables the modeler reads at runtime. They are data rather than code, so
# nothing imports them and a missing entry here does not fail until a user asks for a named
# material -- which is why the CI `minimal` job installs the built package and runs outside
# the checkout rather than importing the source tree.
[tool.setuptools.package-data]
fieldwave = ["nk_data/filmetrics/*.txt", "nk_data/matlab/*.mat"]

# The rule set is narrow on purpose: every entry below names a defect, none names a
# preference. That distinction is the whole policy. Ruff's own default set reports 651
# findings here, led by 346 C408 (`dict()` where `{}` would do) and 73 I001 (import order),
# and `--select ALL` reaches 4006 E501 and 3979 Q000. Acting on those would rewrite the
# hand-wrapped docstrings that carry most of the reasoning in this codebase, in exchange for
# no defect found. Add a rule when it can fail a run, not when it can tidy one.
#
# F401 is the one that earns its place by history rather than by principle. It is the failure
# this repo accumulates: a refactor moves a function, the import that fed it stays, and the
# module goes on advertising a dependency it no longer has. `_core/analytic.py` carried
# `from .factorization import dfs2d` unused across every commit since 672993c, which reads as
# if the module obtains its coefficients off a raster -- the one thing it exists not to do.
#
# The rest are free insurance: each sits at zero findings today, so they cost nothing until
# something actually breaks. F821 is not hypothetical -- it is what found the commented-out
# `import fieldwave` in tests/references/interface/Reticolo.py, where line 244 still called
# `fieldwave.rcwa(...)`. F811 matters most in the suite, where a duplicated test name silently
# shadows the earlier definition and the lost test is never reported as missing.
#
# F841 (assigned-but-unused local) is deliberately absent: 14 of them exist, and in numerical
# code an unused intermediate is as often a kept-for-reading step as a mistake. It would spend
# attention rather than save it.
[tool.ruff.lint]
select = ["F401", "F811", "F821", "F632", "E711", "E712", "E714"]

# The package's public surface. `import fieldwave; fieldwave.Layer` works precisely because
# __init__ binds these names and nothing here uses them, so all 19 read as unused. The other
# spelling is an `__all__` repeating the same 19 names, which states it at more length.
#
# Note what is *not* exempted: tests/references/ and tutorials/ stay linted. They look like
# throwaway comparison harnesses, which is exactly the argument for skipping them -- and the
# Reticolo bug above was sitting in one of them.
[tool.ruff.lint.per-file-ignores]
"fieldwave/__init__.py" = ["F401"]
