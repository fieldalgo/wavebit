[build-system]
# SPDX license strings require the PEP 639-capable build backend.
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "wavebit"
version = "0.0.4"
description = "Differentiable electromagnetic simulation with RCWA and FDTD"
readme = "README.md"
license = "Apache-2.0 AND MIT"
# Shipped in the sdist and in the wheel's .dist-info/licenses/; tools/run_distribution_smoke.py
# checks that both carry them unchanged.
license-files = ["LICENSE", "LICENSE.meent", "LICENSE.fmmax", "NOTICE"]
classifiers = ["Development Status :: 3 - Alpha"]
authors = [{ name = "FieldAlgo", email = "dev@fieldalgo.com" }]

# Driven by the base install alone, not by the optional backends: jax 0.11 also needs
# 3.12, but pip enforces that from jax's own metadata when the extra is requested, so
# it is not what sets this. The binding constraints are the numpy and scipy floors
# below -- numpy 2.5.1 and scipy 1.18 both declare Requires-Python >=3.12, and
# array-api-compat 1.15 still declares >=3.10, so it does not bind.
#
# This said >=3.10 until the numpy/scipy floors were raised past it, which made the
# declaration unsatisfiable rather than merely generous: on 3.10 the newest numpy pip
# will consider is 2.2.6, so `pip install wavebit` failed at resolution with "No
# matching distribution found for numpy>=2.5.1". Keep this in step with those floors --
# the `minimal` CI job runs on every version listed here, which is what caught it.
requires-python = ">=3.12"

# Floors are the versions the suite is actually verified against, not the oldest that
# might happen to work. That rule is applied literally to the numerical stack -- numpy,
# scipy, array-api-compat, jax, torch -- whose exact versions the frozen goldens are
# pinned against; each floor below is a version the full suite has been run on, and
# nothing between it and the previous floor is claimed. Loosening a floor later is safe
# and cheap; tightening one after a release is not, so they start strict. `tqdm` and
# `optax` are exempt: neither touches a number the goldens cover.
#
# History behind the numpy floor, which now sits well above it: NumPy 2.2.x and 2.3.0
# have a bug in the complex `matmul` FP-status check, where an ordinary complex matrix
# product raises a cascade of `RuntimeWarning: overflow / divide by zero / invalid value
# encountered in matmul` on values nowhere near overflow -- measured here on a
# convolution matrix with condition number 12 whose largest entry was 2.1. A single 2D
# solve emitted 456 of them. The values were never affected (energy conserved to ~1e-14,
# and the results are bit-identical across versions); only the reporting was. 2.3.1 fixed
# it, and was the floor until the floors were aligned with what is actually verified.
dependencies = [
    "numpy>=2.5.1",
    "scipy>=1.18",
    "array-api-compat>=1.15",
]

[project.optional-dependencies]
# The jax floor is a hard requirement on top of the verification rule, not just a record:
# src/wavebit/_common/backend.py calls jax.lax.linalg.eig(enable_eigvec_derivs=True), which does not
# exist before 0.11 -- an older jax installs fine and then fails at the first
# eigendecomposition.
#
# The ceiling is temporary. jax 0.12.0 (2026-10-19) recompiles the FDTD scene on a repeated
# solve -- tests/fdtd/test_fdtd_scan_programs.py::test_a_repeated_scene_solve_runs_no_compiler
# logs 106 jit compilations on 0.12.0 and none on 0.11.2, on the same code -- and five single-
# trace FDTD tests fail with it. Nothing has been verified on 0.12, so it stays out until the
# FDTD side is fixed for it and the suite has been run there; then lift the ceiling.
jax = [
    "jax>=0.11,<0.12",
    "jaxlib>=0.11,<0.12",
    "optax>=0.2",
    "tqdm>=4.67",
]

# 2.14, the version the suite is verified against (CI installs the CPU index's 2.14.1; this
# floor follows what was measured, not what might work). 2.7 cannot compile this solver:
# `torch.compile` dies with `InternalTorchDynamoError` on every path, from four separate
# PyTorch defects, all gone by 2.13. 2.13 then miscompiled a complex identity's in-place
# diagonal write under Inductor (docs/development/torch-upstream-defects.md, defect 1), which
# the doors around every public call make harmless and which PyTorch fixed in 2.14.0
# (pytorch/pytorch#182012). Eager and autograd work on 2.7, so none of this is about enabling
# `torch.compile` -- which is not worth using either way; see docs/development/torch-compile.md.
# Versions between 2.8 and 2.13 were tested only as described there.
pytorch = [
    "torch>=2.14",
    "tqdm>=4.67",
]

# Building the documentation site (`sphinx-build -b html docs docs/_build/html`), which
# nothing at runtime needs. Floored rather than pinned, unlike ruff in the CI workflow: these
# decide how prose is rendered, not whether a check passes, so a newer one cannot turn a
# commit that changed nothing red.
#
# `myst-parser` is why `docs/` stays markdown; `sphinx-external-toc` is why the navigation
# stays out of the pages, so that a document reads the same on GitHub as on the site.
# `sphinx.ext.autodoc` needs no entry -- it ships with Sphinx, and it is what makes the 760
# `:func:` / `:class:` roles in this codebase's docstrings resolve to links rather than
# arriving as literal text.
docs = [
    "sphinx>=9.1",
    "pydata-sphinx-theme>=0.21",
    "myst-parser>=5.1",
    "sphinx-design>=0.7",
    "sphinx-external-toc>=1.1",
    "sphinxcontrib-mermaid>=2.1",
]

# Only normal_method='contour' reads this (subpixel level-set extraction); everything else
# in the package runs without it, so it stays optional. The floor is the version the
# construction was measured with. contourpy ships with matplotlib, so most environments
# already have it.
contour = [
    "contourpy>=1.3",
]

# Only plotting imports Matplotlib; numerical solves and minimal installs do not need it.
plot = [
    "matplotlib>=3.10.1",
]

[project.urls]
Homepage = "https://github.com/fieldalgo/wavebit"

[tool.setuptools.packages.find]
where = ["src"]
include = ["wavebit*"]

# Refractive-index tables the modeler reads at runtime. They are data rather than code, so
# nothing imports them and a missing entry here does not fail until a user asks for a named
# material -- which is why the CI `minimal` job installs the built package and runs outside
# the checkout rather than importing the source tree.
[tool.setuptools.package-data]
wavebit = ["data/refractiveindex/*.txt", "data/refractiveindex/README.md"]

# The rule set is narrow on purpose: every entry below names a defect, none names a
# preference. That distinction is the whole policy. Ruff's own default set reports 651
# findings here, led by 346 C408 (`dict()` where `{}` would do) and 73 I001 (import order),
# and `--select ALL` reaches 4006 E501 and 3979 Q000. Acting on those would rewrite the
# hand-wrapped docstrings that carry most of the reasoning in this codebase, in exchange for
# no defect found. Add a rule when it can fail a run, not when it can tidy one.
#
# F401 is the one that earns its place by history rather than by principle. It is the failure
# this repo accumulates: a refactor moves a function, the import that fed it stays, and the
# module goes on advertising a dependency it no longer has. `src/wavebit/rcwa/_engine/parametric.py` carried
# `from .factorization import dfs2d` unused across every commit since 672993c, which reads as
# if the module obtains its coefficients off a raster -- the one thing it exists not to do.
#
# The rest are free insurance: each sits at zero findings today, so they cost nothing until
# something actually breaks. F821 is not hypothetical -- it is what found the commented-out
# `import wavebit` in tests/references/interface/Reticolo.py, where line 244 still called
# `wavebit.rcwa(...)`. F811 matters most in the suite, where a duplicated test name silently
# shadows the earlier definition and the lost test is never reported as missing.
#
# F841 (assigned-but-unused local) is deliberately absent: 14 of them exist, and in numerical
# code an unused intermediate is as often a kept-for-reading step as a mistake. It would spend
# attention rather than save it.
[tool.ruff.lint]
select = ["F401", "F811", "F821", "F632", "E711", "E712", "E714"]

# Nothing is exempted, and there is no `per-file-ignores` table on purpose. tests/references/
# and tutorials/ stay linted: they look like throwaway comparison harnesses, which is exactly
# the argument for skipping them -- and the Reticolo bug above was sitting in one of them.
#
# `src/wavebit/__init__.py` is the one file that would ask for an exemption, since it binds the
# public surface and uses none of it, so every export reads as unused. It declares `__all__`
# instead, which ruff reads as the use. That puts the surface in the file it describes, and it
# keeps F401 pointed at that file rather than silenced for it: an export added without a line
# in `__all__` now fails the lint. This comment used to carry the count instead, and the count
# drifted 19 -> 34 unnoticed -- the argument against restating in prose what the code can state
# itself, and hold itself to.

[tool.pytest.ini_options]
# Repository-only study helpers are imported by the reference tests. The package
# itself still comes from the editable src install, checked in tests/conftest.py.
pythonpath = ["."]
# Recognize the optional CI timeout plugin marker in base developer installs.
# `research` is deselected from a run that names only directories -- `pytest tests`, and
# so CI -- by `tests/conftest.py`; `-m research` runs that tier alone. See `tests/README.md`.
markers = [
    "timeout(seconds): per-test deadline enforced by pytest-timeout in CI",
    "research: tests of the experimental conforming NVF module and its study instruments",
]
