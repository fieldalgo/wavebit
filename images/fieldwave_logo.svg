<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 160" width="560" height="160" role="img" aria-label="FieldWave">
  <title>FieldWave</title>
  <defs>
    <linearGradient id="fw" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0ea5e9"/>
      <stop offset="1" stop-color="#6366f1"/>
    </linearGradient>
  </defs>

  <!-- Mark: a field sampled on a grating — five bars under a wave envelope. -->
  <g fill="url(#fw)">
    <rect x="8"   y="60"  width="14" height="40"  rx="7"/>
    <rect x="34"  y="40"  width="14" height="80"  rx="7"/>
    <rect x="60"  y="25"  width="14" height="110" rx="7"/>
    <rect x="86"  y="40"  width="14" height="80"  rx="7"/>
    <rect x="112" y="60"  width="14" height="40"  rx="7"/>
  </g>

  <!-- Wordmark -->
  <text x="160" y="112"
        font-family="Helvetica Neue, Helvetica, Arial, sans-serif"
        font-size="86" letter-spacing="-1.5" fill="url(#fw)">
    <tspan font-weight="300">Field</tspan><tspan font-weight="700">Wave</tspan>
  </text>
</svg>
