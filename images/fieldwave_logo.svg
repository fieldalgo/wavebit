<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 160" width="560" height="160" role="img" aria-label="FieldWave">
  <title>FieldWave</title>

  <!-- Mark: five bars under a wave envelope, coloured across the visible spectrum —
       white light dispersed by a grating, which is what the solver computes. -->
  <rect x="8"   y="60" width="14" height="40"  rx="7" fill="#e11d48"/>
  <rect x="34"  y="40" width="14" height="80"  rx="7" fill="#f59e0b"/>
  <rect x="60"  y="25" width="14" height="110" rx="7" fill="#22c55e"/>
  <rect x="86"  y="40" width="14" height="80"  rx="7" fill="#0ea5e9"/>
  <rect x="112" y="60" width="14" height="40"  rx="7" fill="#7c3aed"/>

  <!-- Wordmark. Teal holds 3.74:1 on white and 5.05:1 on #0d1117, so one file
       carries both the light and dark GitHub themes. -->
  <text x="160" y="112"
        font-family="Helvetica Neue, Helvetica, Arial, sans-serif"
        font-size="86" letter-spacing="-1.5" fill="#0d9488">
    <tspan font-weight="300">Field</tspan><tspan font-weight="700">Wave</tspan>
  </text>
</svg>
