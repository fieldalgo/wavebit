name: Accuracy report
description: The calculation runs, but a number is less accurate than it should be.
labels: [accuracy]
body:
  - type: markdown
    attributes:
      value: |
        Accuracy questions and research observations are welcome before a reference is available.
        Include an analytic result, solver comparison or convergence evidence if known; mark unknowns honestly.
  - type: input
    id: quantity
    attributes:
      label: Quantity
      description: What is off, for example `sum(T)`, a per-order efficiency, or a derivative with respect to a radius.
    validations:
      required: true
  - type: textarea
    id: script
    attributes:
      label: Minimal script
      description: Optional if available; a reproducer is not required to report an observation or question.
      render: python
    validations:
      required: false
  - type: textarea
    id: values
    attributes:
      label: Wavebit's value and the reference
      description: Available observations or accuracy question; include a reference and discrepancy if known, or say what remains unknown.
    validations:
      required: true
  - type: textarea
    id: convergence
    attributes:
      label: Convergence
      description: Does the gap shrink with the Fourier order, the grid or the step size? Which settings did you try?
  - type: dropdown
    id: backends
    attributes:
      label: Backends tried
      multiple: true
      options: [NumPy, JAX, PyTorch]
  - type: input
    id: versions
    attributes:
      label: Versions
      placeholder: wavebit 0.0.3, Python 3.12, NumPy 2.5, JAX 0.11, PyTorch 2.13
    validations:
      required: false
