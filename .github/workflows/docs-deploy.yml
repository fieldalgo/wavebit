# Publishes the Sphinx site to GitHub Pages when a GitHub release is published, built from the
# release's tag, and on demand from the Actions tab (pick the tag to rebuild). The website
# proxies `wavebit.fieldalgo.com/docs/*` to the Pages site.
#
# A release because the published documentation describes the released package (owner decision,
# 2026-10-15): the same event that `python-publish.yml` uploads to PyPI on, so the site and the
# package change together, and the version the site shows (`docs/conf.py` reads
# `wavebit.__version__`) is the version on PyPI. The `github-pages` environment's deployment
# policy allows the `main` branch and `v*` tags; a run from any other ref is refused before it
# builds. Documentation for `main` between releases (a `/dev/` site with a version switcher) is a later step
# and needs that policy widened first.
#
# Pages is set to deploy from GitHub Actions (Settings -> Pages -> Source).
#
# Like the PyPI upload, it waits for `release-gate.yml`: the site is not published unless
# `tests` already passed on the commit being published.
#
# A custom domain (`docs.fieldalgo.com`, say) is a `CNAME` file listed in `html_extra_path`
# plus the DNS record; nothing here changes for it.
name: docs deploy

on:
  workflow_dispatch:
  release:
    types: [published]

# The Pages deployment needs these three and nothing else. `id-token` is what lets
# `deploy-pages` prove to Pages that this run is the one that built the artifact.
permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time, and never cancel one in flight: a half-applied deploy leaves the
# site in a state nobody wrote. This is the opposite setting from `tests.yml`, where cancelling
# a superseded run is exactly right.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  gate:
    uses: ./.github/workflows/release-gate.yml
    permissions:
      actions: read

  deploy:
    needs: gate
    name: build and deploy
    runs-on: ubuntu-latest

    # Never publish a site from a private repository (Pages would make it public anyway). The
    # repository is public since 2026-10-15; the guard stays for any private fork of it. If the
    # field is ever missing from the event payload the expression is falsy and the job is
    # skipped, which is the direction a guard should fail in.
    if: github.event.repository.private == false

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip

      # autodoc imports the package to read its docstrings, so the site cannot be built from
      # the markdown alone. NumPy only -- nothing on the public surface needs an optional
      # backend to be introspected.
      - name: Install Wavebit and the docs extra
        run: pip install -e '.[docs]'

      # `-W` here as well as in `tests.yml`: a deploy is the worst place to discover that a
      # renamed symbol left a page short.
      - name: Build English and Korean sites, warnings as errors
        run: |
          python -m sphinx -W -b html -D wavebit_bilingual=1 -d docs/_build/doctrees/en docs docs/_build/html
          python -m sphinx -W -b html -D wavebit_bilingual=1 -D language=ko -d docs/_build/doctrees/ko docs docs/_build/html/ko

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs/_build/html

      - id: deployment
        uses: actions/deploy-pages@v5
