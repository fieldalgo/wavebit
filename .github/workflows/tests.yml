# Four jobs with different purposes.
#
#   test     — installs both optional backends and runs the whole suite. This is
#              where the physics is verified.
#   minimal  — installs the base package alone and only checks that it imports
#              and solves. The `test` job cannot catch a stray top-level
#              `import torch` in the core, because torch is installed there; a
#              numpy-only user would be the first to find out.
#   examples — runs every script under `examples/` and checks it did not fail.
#              The suite imports the library the way the library likes to be
#              imported; the examples are the only thing here that exercises the
#              public API the way a reader of the README would write it, so an
#              interface the code moved out from under them shows up nowhere else.
#              Kept out of `test` because it finishes in well under a minute
#              against that job's ~9, so a broken example is a fast,
#              separately-named red mark rather than nine minutes of waiting.
#   lint     — runs ruff on the rules `pyproject.toml` selects. It installs no
#              package at all, so it answers in seconds; the point is that a
#              rule nothing enforces is a comment. The config landed with 19
#              findings cleared, and without this job the twentieth arrives
#              unannounced.
#   docs     — builds the Sphinx site with `-W`, so any warning fails the job.
#              It does NOT deploy one; see `docs-deploy.yml` for why that is a
#              decision and not an omission. What `-W` buys is the class of
#              breakage nothing else sees: `docs/reference/api.md` names objects
#              by hand and autodoc reports an unimportable one as a warning, so a
#              renamed public symbol fails here instead of leaving a quietly
#              shorter page.
name: tests

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip

      # Pinned, not floored, and that is the opposite of the rule the runtime
      # dependencies follow. A floor there says "verified from here up"; a floor
      # here would let a later ruff introduce findings on a commit that changed
      # nothing, and a red run nobody caused is how a check stops being read.
      # The rule set in pyproject.toml was chosen rather than inherited, so the
      # tool that interprets it is chosen too. Raise this deliberately.
      - name: Install ruff
        run: pip install ruff==0.16.2

      # No package install: ruff reads source, so this job needs neither the
      # dependencies nor a build, and finishes in seconds. `.` covers the
      # notebooks under tutorials/ as well -- ruff lints their cells.
      - name: Check the rules pyproject.toml selects
        run: ruff check .

  test:
    name: full backends
    runs-on: ubuntu-latest
    # The backstop, and it has already been the thing that fired: on run 33715389225
    # the per-test `--timeout` never triggered at all and this is what ended the job,
    # at three hours instead of GitHub's six. The per-test bound is the mechanism and
    # this is the net under it.
    #
    # 180, not 90: the suite legitimately needs about two hours on these runners
    # (it was 55 minutes to 43% on the run that hung), so a tighter number would
    # cut a healthy run. What this buys is that a hang costs three hours of runner
    # time instead of GitHub's six-hour maximum -- and, unlike that maximum, it is
    # a number this repository chose and can lower once the suite is faster.
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          # Matches the development environment, and jax 0.11 requires 3.12.
          python-version: '3.12'
          cache: pip

      # Installed ahead of the package so pip already sees torch>=2.13 as
      # satisfied and does not pull the multi-gigabyte CUDA wheel from PyPI.
      # The CPU index's latest is well above the floor, so this stays satisfied;
      # if the floor ever passes what that index serves, pin it here instead.
      - name: Install CPU-only PyTorch
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu

      # `contour` belongs here with the backends, and its absence cost 41 of the 42
      # failures in run 33738428639 -- every one of them the same ImportError,
      # `normal_method='contour'` reaching for contourpy that no step had installed.
      # It is a real optional extra (pyproject declares it, the default normal method
      # is 'distance', and nothing else in the package reads it), so a user who skips
      # it is fine. This job is not that user: it is the one that installs everything
      # precisely so that no part of the suite goes unexercised.
      - name: Install Wavebit with both optional backends and the contour extra
        run: pip install -e '.[jax,pytorch,contour]' pytest pytest-timeout

      # Fails the run if a backend is missing, which would otherwise turn the
      # cross-backend tests into silent skips: the suite guards them with
      # pytest.importorskip, so an absent backend drops those tests and still
      # reports success.
      #
      # contourpy is checked here too, and it is the reason this step is worth more
      # than it looks. The contour tests do *not* guard with importorskip -- they fail
      # outright -- so a missing optional does not go quiet, it goes loud 41 times and
      # buries the one real failure underneath. Naming it here fails the job in three
      # seconds instead, on the install and not on the physics.
      - name: Verify all three backends and contourpy are importable
        run: python -c "import numpy, jax, torch, contourpy, wavebit; print(wavebit.__file__)"

      # Single-threaded BLAS, so that two calls with the same inputs give the same bits.
      #
      # Part of the suite asserts exact equality between two results computed in the same
      # process -- that freezing a geometry is a no-op, that `full=True` only adds fields,
      # that the core reproduces the legacy chains. Those are claims about this code taking
      # one path twice, and they are worth asserting exactly; but a threaded kernel is free
      # to partition a reduction differently between two calls, and then the last bit moves
      # for reasons that have nothing to do with the claim. That is what these runners did:
      # the same commit failed three such comparisons on one run and passed them on a re-run,
      # and only on the cases with 26x26 mode matrices or larger.
      #
      # (Differing runner CPU models cannot explain it on their own: both results in each of
      # those comparisons are computed in one process on one machine, so a SIMD kernel chosen
      # per CPU applies equally to both.)
      #
      # Nothing here is large enough to want threads -- the biggest mode matrix in the suite
      # is a few hundred square -- so this costs no wall-clock worth measuring.
      - name: Run verification suite
        env:
          OPENBLAS_NUM_THREADS: 1
          OMP_NUM_THREADS: 1
          MKL_NUM_THREADS: 1
          NUMEXPR_NUM_THREADS: 1
          VECLIB_MAXIMUM_THREADS: 1
        #
        # `--timeout` turns a hung test into a named failure instead of a dead job.
        # Without it the run that hangs reports nothing at all: pytest prints its
        # summary at the end, so when GitHub cancels the job at the six-hour mark
        # every failure the run had already found is lost with it. That is not
        # hypothetical -- run 33656262958 stalled at 43% and took two real assertion
        # failures down with it, and neither the stuck test nor the failing ones are
        # named anywhere in its log.
        #
        # The `signal` method is chosen, not inherited. `thread` dumps every stack
        # and then calls `os._exit`, which kills the whole run at the first stuck
        # test -- the same dead job, only faster. `signal` raises inside the test, so
        # the run carries on and the summary still arrives. The cost is that SIGALRM
        # is only delivered when the interpreter is reachable, which is why the job
        # keeps a `timeout-minutes` above it.
        #
        # 1200s is deliberately far above anything here rather than merely above it.
        # The slowest single test in the suite is 63 seconds on a developer machine,
        # but these runners are not that machine -- one 72-test block took 30 minutes,
        # a mean of 25 seconds a test -- and a bound that fires on a slow test rather
        # than a stuck one would be a false red mark on a healthy commit.
        #
        # `-v`, not `-q`, and this is the part that actually diagnoses a hang. `-q`
        # prints one character per test and flushes a line every 72 of them, so a
        # job killed mid-line names none of the 72 -- run 33656262958 and run
        # 33715389225 both died that way, and recovering even the *identity* of what
        # failed took rebuilding pytest's collection order offline and matching it
        # against the skip pattern. `-v` writes the node id *before* running the test
        # and flushes, so the last line of a killed log is the stuck test by name,
        # and every failure is named inline as it happens rather than in a summary
        # that a killed run never reaches.
        #
        # `thread`, not `signal`, and this is a retreat from a choice made one commit
        # ago. `signal` was chosen so a stuck test would fail and let the run carry
        # on; on run 33715389225 it sat through 2h05m of stall without firing once,
        # which says the interpreter never becomes reachable there -- the alarm is
        # set, and no bytecode boundary ever arrives to deliver it. `thread` watches
        # from a second thread that the main thread cannot block, dumps every
        # thread's stack, and exits. That ends the run, which is why it was rejected
        # before; with `-v` above, every failure up to that point is already in the
        # log, so the objection no longer holds. What it buys is the one thing still
        # missing: *where* the process is stuck, not merely which test was running.
        #
        # The deselect is temporary and is tracked by `probes` below. Run
        # 33730652133 named this test as the one that hangs -- it sits in
        # `float(jax.jit(jax.grad(total))(x))` waiting on a computation that never
        # returns, and `thread` ends the run there, so every test after it in
        # collection order becomes invisible. That is not a small blind spot: the
        # parametric refactor renamed `test_analytic.py` to `test_parametric.py`,
        # which moved two known failures from before this point to after it, and
        # that run reported zero failures while both were still there unrun.
        #
        # The whole function, not the one parametrisation that was reached. The
        # `ellipse lx` case is merely the first of the four; `overlapping pair` is
        # 2.3x heavier again locally (36.7s against 16.2s), so deselecting only the
        # case that was observed would buy one more 74-minute run to discover the
        # next one. The two cheap cases go with them, which is the price.
        #
        # It passes locally in 16 seconds, so this is a fact about the runner and
        # not about the feature. Restore it once `probes` says which.
        run: >
          pytest tests -v --timeout=1200 --timeout-method=thread
          --deselect 'tests/test_frozen_geometry.py::test_a_frozen_geometry_makes_a_shape_parameter_traceable'

  # Temporary, non-blocking, and paired with the `--deselect` in `test`. A bench, not a
  # gate: `continue-on-error` at the job and at every arm, because an arm that is expected
  # to be inconclusive some of the time must not colour the run. Delete it with the
  # deselect.
  #
  # The three hang arms that stood here are gone, having answered. Across three runs the
  # control, `--xla_cpu_multi_thread_eigen=false` and unpinned BLAS all stalled the same
  # way, so neither XLA's Eigen pool nor OpenBLAS re-entrancy is the subject and running
  # them again buys nothing. They also cost 5 minutes each, and in run 33840949962 the runner
  # was reclaimed 8m32s in, after two of them, with every step below still `skipped` --
  # `if: always()` holds only while the job is alive. Three arms whose answer was known
  # starved two whose answer was not. So: shortest and least certain first.
  probes:
    name: probes
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip

      - name: Install CPU-only PyTorch
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Install Wavebit with both optional backends
        run: pip install -e '.[jax,pytorch,contour]' pytest pytest-timeout

      - name: What the runner is
        run: free -m && nproc && python -c "import jax, jaxlib; print('jax', jax.__version__, 'jaxlib', jaxlib.__version__)"

      # Which ingredient of the stalled test hangs. Three runs have now named
      # `test_a_frozen_geometry_makes_a_shape_parameter_traceable` and pointed at the same
      # line; none has said whether the eig, our gradient rule, or the solver around them is
      # the part that does not come back. Two arms on a bare 98x98 -- upstream's own eig
      # rule via `enable_eigvec_derivs=True`, and `wavebit._core.backend.eig`, which is
      # `enable_eigvec_derivs=False` under a `custom_vjp` with `_eig_grad`. It carries its
      # own `faulthandler` deadline, so a hang reports every thread's stack rather than
      # waiting for the job's clock to end it.
      #
      # One-sided, and worth saying so: a hang locates the ingredient, a clean run does not
      # clear it. Neither arm carries the layer chain, the cascade or the frozen-geometry
      # replay, so "did not reproduce" means "not this alone".
      - name: eig hang -- is it the eig, or ours, or neither
        if: always()
        continue-on-error: true
        env:
          EIG_ITERS: 8
          OPENBLAS_NUM_THREADS: 1
          OMP_NUM_THREADS: 1
          MKL_NUM_THREADS: 1
          NUMEXPR_NUM_THREADS: 1
          VECLIB_MAXIMUM_THREADS: 1
        run: |
          python - <<'EIGREPRO'
          """Which ingredient of the stalled test hangs: the eig, our gradient rule, or neither.

          `test_a_frozen_geometry_makes_a_shape_parameter_traceable` stalls inside
          `float(jax.jit(jax.grad(total))(x))` on GitHub's two-core runners -- 5h, then 2h, then
          past every bound since -- and takes 16s on a ten-core developer machine. The eager grad
          one line above completes every time, and the compiled program's expensive contents are
          one `lax.linalg.eig` on a 2*n_orders square, 98 for that test's truncation_order.

          Two arms on a random 98x98, no solver and no geometry in either:

            jax       `lax.linalg.eig(enable_eigvec_derivs=True)` -- upstream's own rule.
            wavebit   `wavebit._core.backend.eig` -- `enable_eigvec_derivs=False` under a
                      `custom_vjp` with `_eig_grad`, which is what the solver actually runs.

          The asymmetry is worth stating: a hang here locates the ingredient, and a clean run does
          NOT clear it. Neither arm carries the solver's layer chain, its scattering cascade or its
          frozen-geometry replay, so "did not reproduce" means "not this alone", not "not ours".
          """
          import faulthandler
          import os
          import sys
          import time

          import jax
          import jax.numpy as jnp
          import jax.lax.linalg as jll

          N = int(os.environ.get('EIG_N', 98))
          ITERS = int(os.environ.get('EIG_ITERS', 20))
          BUDGET = int(os.environ.get('EIG_BUDGET', 240))

          jax.config.update('jax_enable_x64', True)
          # Self-report rather than be killed by the job's clock: dumps every thread's stack.
          faulthandler.dump_traceback_later(BUDGET, exit=True)

          B = (jax.random.normal(jax.random.PRNGKey(0), (N, N), dtype=jnp.float64)
               + 1j * jax.random.normal(jax.random.PRNGKey(1), (N, N), dtype=jnp.float64))


          def make(which):
              if which == 'wavebit':
                  from wavebit._core.backend import eig as _eig
              else:
                  def _eig(A):
                      return jll.eig(A, compute_left_eigenvectors=False,
                                     compute_right_eigenvectors=True, enable_eigvec_derivs=True)

              def f(x):
                  A = B * x + jnp.eye(N, dtype=jnp.complex128) * (1.0 + x)
                  w, V = _eig(A)
                  # Rebuilding A from its own decomposition, which is the shape a layer uses and,
                  # more to the point, the only term tried here that the eigenvectors actually reach.
                  # Two that look like they do and do not: `sum(|solve(V, 1)|^2)` and `sum(Re V)`
                  # each move the gradient by under 1e-9 on both arms, against a base of 7.32e+03.
                  # This one moves it to 1.94e+04. A term that reads as exercising V without moving
                  # the gradient would make both arms an eigenvalue test under another name.
                  return jnp.real(jnp.sum(w * jnp.conj(w))
                                  + jnp.sum(jnp.abs(V @ jnp.diag(w) @ jnp.linalg.inv(V))))
              return f


          print(f'N={N} cores={os.cpu_count()} jax={jax.__version__}', flush=True)
          for which in ('jax', 'wavebit'):
              try:
                  f = make(which)
              except Exception as e:                                          # noqa: BLE001
                  print(f'[{which}] unavailable: {type(e).__name__}: {e}', flush=True)
                  continue
              x = jnp.asarray(0.37)
              t = time.perf_counter()
              eager = float(jax.grad(f)(x))
              print(f'[{which}] eager grad {eager:.6e} in {time.perf_counter() - t:.2f}s', flush=True)

              g = jax.jit(jax.grad(f))
              worst = 0.0
              for i in range(ITERS):
                  t = time.perf_counter()
                  got = float(g(jnp.asarray(0.37 + 0.001 * i)))
                  dt = time.perf_counter() - t
                  if dt > 20:
                      print(f'[{which}] iter {i}: {dt:.1f}s  <-- slow', flush=True)
                  worst = max(worst, dt)
              print(f'[{which}] jit(grad) x{ITERS}: worst {worst:.2f}s, last {got:.6e}', flush=True)

          faulthandler.cancel_dump_traceback_later()
          print('finished, no hang')
          sys.exit(0)
          EIGREPRO

      # Written once, run twice. Run 33820383369 measured the bare version on a runner and
      # got 0 divergences in 25 iterations -- 100 solves -- while the suite in the *same run*
      # failed the test. So the flake needs the suite's context, and the obvious candidate is
      # what has been imported by then: the failing test sits about 700 tests in, and torch
      # and jax are both long since loaded. torch ships its own OpenMP runtime on Linux, and
      # a second OMP runtime in the process changes how OpenBLAS below numpy behaves --
      # `OPENBLAS_NUM_THREADS=1` does not prevent that, it only sets a count.
      #
      # If only the preloaded arm diverges, that is the hole in this file's thread pinning,
      # named. If neither does, the context is something else and the next thing to vary is
      # which tests ran, not what was imported.
      - name: bit identity -- write the probe
        if: always()
        run: |
          cat > /tmp/bitprobe.py <<'PROBE'
          import os
          import sys
          import numpy as np

          if os.environ.get('PROBE_PRELOAD'):
              import torch                      # noqa: F401
              import jax                        # noqa: F401
              print(f'preloaded torch {torch.__version__}, jax {jax.__version__}, '
                    f'torch threads {torch.get_num_threads()}')

          sys.path.insert(0, '.')
          sys.path.insert(0, 'tests')
          from test_answers_declaration import _solver, RUNGS

          FIELDS = ('R_s', 'R_p', 'T_s', 'T_p')

          def once(rung, algo='SMM'):
              r = _solver(answers=rung, layer_algorithm=algo).solve()
              out = {'T': np.asarray(r.T), 'R': np.asarray(r.R)}
              for k in FIELDS:
                  v = getattr(r.given, k, None)
                  if v is not None:
                      out[k] = np.asarray(v)
              return out

          def differ(x, y):
              return x.tobytes() != y.tobytes()

          rung_bad = repeat_bad = 0
          N = 25
          for i in range(N):
              a, b, c = once('efficiency'), once('amplitude'), once('field')
              d = once('efficiency')                      # the control: same rung, again
              across = [k for k in ('T', 'R') if differ(a[k], b[k]) or differ(a[k], c[k])]
              amps = [k for k in FIELDS if k in b and k in c and differ(b[k], c[k])]
              repeat = [k for k in ('T', 'R') if differ(a[k], d[k])]
              if (across or amps) and rung_bad == 0:
                  k = (across + amps)[0]
                  ref, alt = a.get(k, b.get(k)), b.get(k, c.get(k))
                  print(f'iter {i}: rungs differ in {across + amps}, '
                        f'max |d| {np.abs(ref - alt).max():.3e}')
              if repeat and repeat_bad == 0:
                  k = repeat[0]
                  print(f'iter {i}: SAME rung twice differs in {repeat}, '
                        f'max |d| {np.abs(a[k] - d[k]).max():.3e}  <-- control fired')
              rung_bad += bool(across or amps)
              repeat_bad += bool(repeat)
          print(f'{N} iterations: rungs differed {rung_bad}, '
                f'same-rung-repeat differed {repeat_bad}')
          PROBE

      - name: bit identity -- bare process
        if: always()
        continue-on-error: true
        env:
          OPENBLAS_NUM_THREADS: 1
          OMP_NUM_THREADS: 1
          MKL_NUM_THREADS: 1
          NUMEXPR_NUM_THREADS: 1
          VECLIB_MAXIMUM_THREADS: 1
        run: python /tmp/bitprobe.py

      - name: bit identity -- after torch and jax are loaded
        if: always()
        continue-on-error: true
        env:
          PROBE_PRELOAD: 1
          OPENBLAS_NUM_THREADS: 1
          OMP_NUM_THREADS: 1
          MKL_NUM_THREADS: 1
          NUMEXPR_NUM_THREADS: 1
          VECLIB_MAXIMUM_THREADS: 1
        run: python /tmp/bitprobe.py

  examples:
    name: examples smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip

      # Same reason as in `test`: get the CPU wheel in before the extras can pull
      # the CUDA one.
      - name: Install CPU-only PyTorch
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu

      # Both backends, because `shapes_1d` solves on torch,
      # `shapes_2d` on jax, and the two `_verification` ones run all three.
      # No matplotlib: nothing under examples/ plots any more, and it is not a
      # dependency of the library and never should be.
      - name: Install Wavebit with both optional backends
        run: pip install -e '.[jax,pytorch]'

      # Runs every examples/**/*.py from its own directory under MPLBACKEND=Agg and
      # fails on a non-zero exit, a `Traceback`, or an `UnphysicalResultWarning`.
      #
      # That third condition is the one worth defending: a script can run to
      # completion and still return R+T > 1 on a passive stack, so an exit-code-only
      # check would pass a solve that is physically wrong. The runner's docstring
      # says what the check cannot see.
      - name: Run every example
        run: python tests/run_examples_smoke.py

  minimal:
    name: minimal install
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The floor declared in pyproject.toml, and every version up to the one the
        # full suite runs on. Those coincide at 3.12 today, so this is a single entry
        # -- kept as a matrix because raising the ceiling means adding to this list,
        # and because it is the check that keeps requires-python honest: it is what
        # caught the floor declaring >=3.10 while numpy>=2.5.1 demanded >=3.12.
        python-version: ['3.12']
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # No extras, and a real (non-editable) install.
      - name: Install Wavebit alone
        run: pip install .

      # Runs outside the checkout on purpose: from the repo root `import
      # wavebit` would resolve to the source tree and the installed package
      # would never be exercised.
      #
      # Written in today's public spelling, and it has to be: every retired
      # keyword raises by name, so a stale call here fails the job rather than
      # solving something else. It was stale exactly once, which is why this
      # note exists -- the call below survived two renames untouched because no
      # test imports this file. The scene is the one it always was, restated:
      #
      #   pol=1        -> tetm='tm'     (retired earlier and separately -- `pol`
      #                                  said polarization, solver path and a
      #                                  derived psi all at once)
      #   n_top/n_bot  -> top/bot
      #   ucell        -> structure
      #   and the values are relative PERMITTIVITY now, so the substrate's
      #   n = 1.5 is 2.25 and the film's n = 3.8 is 14.44. Renaming without
      #   squaring is the silent half-migration: 3.8 is a legal permittivity,
      #   the solve still conserves energy, and it answers a different question.
      - name: Import and solve without any optional backend
        working-directory: ${{ runner.temp }}
        run: |
          python - <<'PY'
          import sys
          import numpy as np
          import wavebit

          res = wavebit.rcwa(
              backend=0, tetm='tm', top=1.0, bot=2.25, theta=0.0, phi=0.0,
              truncation_order=2, wavelength=632.8, period=[1000],
              structure=np.array([[[14.44, 14.44]]]), thickness=[200],
          ).solve()

          R, T = float(res.R.sum()), float(res.T.sum())
          assert 0.0 <= R <= 1.0 and 0.0 <= T <= 1.0, (R, T)
          assert abs(R + T - 1.0) < 1e-9, R + T

          eager = {m.split('.')[0] for m in sys.modules} & {'jax', 'torch'}
          assert not eager, f'optional backend imported on the numpy path: {eager}'

          print(f'numpy-only solve OK: R={R:.6f} T={T:.6f}')
          PY

  docs:
    name: docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip

      # The package itself, because autodoc imports it to read the docstrings -- NumPy only,
      # since nothing on the public surface needs an optional backend to be introspected.
      - name: Install Wavebit and the docs extra
        run: pip install -e '.[docs]'

      # `-W` turns every warning into a failure, and that is the whole check rather than a
      # tidiness preference. `docs/reference/api.md` names objects by hand, and autodoc
      # reports a name it cannot import as a warning -- so with `-W`, a public symbol that is
      # renamed or moved fails this job instead of leaving a quietly shorter page. It also
      # catches a dead cross-reference and a `_toc.yml` entry with no file. The build is at
      # zero warnings, which is what makes the switch usable.
      - name: Build the site, warnings as errors
        run: sphinx-build -W -b html docs docs/_build/html
