# Six jobs with different purposes.
#
#   test     — installs both optional backends and runs the default suite. This is
#              where the physics is verified. The `research` tier (tests of the
#              experimental conforming NVF module and its study instruments) is
#              left out of a run over `tests` by `tests/conftest.py`, and no job
#              here runs it: it is a development aid for that research code, run
#              by hand while the code is worked on, not a gate on other changes.
#              tests/README.md says how. Both numerical jobs use the recorded runner;
#              source-writing tests execute serially in a private source snapshot.
#   slow     — runs the tests marked `slow` (tests/conftest.py): the FDTD line's
#              resolution-refinement studies, finite-difference gradient checks
#              and Meep comparisons.
#              Together with `test` it covers the default tier on every push, split so
#              that neither half runs into the job limit.
#   minimal  — builds an sdist and its wheel, installs in an isolated venv, and
#              checks NumPy RCWA/FDTD, bundled data and the optional plot extra.
#              Runs on Linux, macOS and Windows; no source-tree import fallback.
#   examples — runs every script under `examples/` and checks it did not fail.
#              The suite imports the library the way the library likes to be
#              imported; the examples are the only thing here that exercises the
#              public API the way a reader of the README would write it, so an
#              interface the code moved out from under them shows up nowhere else.
#              Kept separate so a broken example has its own failure report.
#   lint     — runs ruff on the rules `pyproject.toml` selects. It installs no
#              package at all, so it answers in seconds; the point is that a
#              rule nothing enforces is a comment. The config landed with 19
#              findings cleared, and without this job the twentieth arrives
#              unannounced.
#   docs     — builds the Sphinx site with `-W`, so any warning fails the job.
#              It does NOT deploy one; see `docs-deploy.yml` for why that is a
#              decision and not an omission. What `-W` buys is the class of
#              breakage nothing else sees: `docs/reference/api.md` names objects
#              by hand and autodoc reports an unimportable one as a warning, so a
#              renamed public symbol fails here instead of leaving a quietly
#              shorter page.
name: tests

on:
  push:
    # main is the only long-lived branch since 2026-10-16: every change reaches it by a pull
    # request whose run was green, so a push here is a record of the landed state, and a
    # release is a tag on one of its commits (owner, 2026-10-16).
    branches: [main]
  pull_request:
    # `ready_for_review` is not in the default set, and it is the event that matters: a draft
    # pull request runs nothing here (see the `if:` on every job), so the run that gates the
    # landing starts when the author marks it ready, after the local tests (owner, 2026-10-16).
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

concurrency:
  # Each main run records a landed state independently: do not serialize main runs
  # or replace a pending one when another commit lands. Runner capacity still applies.
  # Other refs keep one group so newer PR updates supersede their older checks.
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  lint:
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip

      # Pinned, not floored, and that is the opposite of the rule the runtime
      # dependencies follow. A floor there says "verified from here up"; a floor
      # here would let a later ruff introduce findings on a commit that changed
      # nothing, and a red run nobody caused is how a check stops being read.
      # The rule set in pyproject.toml was chosen rather than inherited, so the
      # tool that interprets it is chosen too. Raise this deliberately.
      - name: Install ruff
        run: pip install ruff==0.16.2

      # No package install: ruff reads source, so this job needs neither the
      # dependencies nor a build, and finishes in seconds. `.` covers the
      # notebooks under tutorials/ as well -- ruff lints their cells.
      - name: Check the rules pyproject.toml selects
        run: ruff check .

  test:
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    name: full backends (${{ matrix.shard }}/6)
    runs-on: ubuntu-latest
    # Six shards, each its own runner, since 2026-10-15. Not for speed first: for memory.
    # This partition never finished on these runners between 2026-09-11 and then. The two
    # xdist workers' resident memory grows through the run (1.1 to 7.8 GB of the runner's
    # 7.9, with 3 GB of swap, measured with `free -m` every 5 s on run 38675626066), until the
    # runner service kills itself with "received a shutdown signal", exit 143, at 50 to 61 %
    # -- 79 minutes in on run 38714919709, 114 on 38712716110. Nothing a test asserts is
    # that large; it is what a long-lived worker accumulates across thousands of JAX and
    # PyTorch tests. A fresh runner per shard resets it: the first sharded run (38727516339,
    # four shards) lost no runner. It also measured the suite: the four shards took 55, 70
    # and more than 81 minutes each (two were at 98 % when the run was cancelled), so the
    # whole partition is about 300 worker-minutes at `-n 2`, not the 250 extrapolated from
    # the first 61 %. Six shards put a shard near 50 minutes.
    #
    # `--shard` assigns whole files, largest first to the lightest shard, from the same
    # collection every shard records, and `test-complete` below refuses to call the suite
    # green unless the six add up to exactly that collection. So nothing can fall between
    # the shards, and a shard that never reports fails the run by number. Shards are balanced
    # by test count, and files differ in cost, so expect some spread between them.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    # The backstop under the per-test `--timeout`, which on run 33715389225 never fired
    # while this did, after three hours. 120 for a shard whose healthy length is about 50
    # minutes (above): a hang costs two hours of runner time instead of GitHub's six, and a
    # shard that is merely heavy is not cut.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          # Matches the development environment, and jax 0.11 requires 3.12.
          python-version: '3.12'
          cache: pip

      # Installed ahead of the package so pip already sees torch>=2.13 as
      # satisfied and does not pull the multi-gigabyte CUDA wheel from PyPI.
      # The CPU index's latest is well above the floor, so this stays satisfied;
      # if the floor ever passes what that index serves, pin it here instead.
      - name: Install CPU-only PyTorch
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu

      # `contour` belongs here with the backends, and its absence cost 41 of the 42
      # failures in run 33738428639 -- every one of them the same ImportError,
      # `normal_method='contour'` reaching for contourpy that no step had installed.
      # It is a real optional extra (pyproject declares it, the default normal method
      # is 'distance', and nothing else in the package reads it), so a user who skips
      # it is fine. This job is not that user: it is the one that installs everything
      # precisely so that no part of the suite goes unexercised.
      # Install plotting too so time-record coordinate/animation tests cannot silently skip.
      - name: Install Wavebit with both optional backends, contour, and plotting
        run: pip install -e '.[jax,pytorch,contour,plot]' pytest pytest-timeout pytest-xdist

      # Fails the run if a backend is missing, which would otherwise turn the
      # cross-backend tests into silent skips: the suite guards them with
      # pytest.importorskip, so an absent backend drops those tests and still
      # reports success.
      #
      # contourpy is checked here too, and it is the reason this step is worth more
      # than it looks. The contour tests do *not* guard with importorskip -- they fail
      # outright -- so a missing optional does not go quiet, it goes loud 41 times and
      # buries the one real failure underneath. Naming it here fails the job in three
      # seconds instead, on the install and not on the physics.
      - name: Verify all three backends and contourpy are importable
        run: python -c "import numpy, jax, torch, contourpy, matplotlib, wavebit; print(wavebit.__file__)"

      # Single-threaded BLAS, so that two calls with the same inputs give the same bits.
      #
      # Part of the suite asserts exact equality between two results computed in the same
      # process -- that freezing a geometry is a no-op, that `full=True` only adds fields,
      # that the core reproduces the legacy chains. Those are claims about this code taking
      # one path twice, and they are worth asserting exactly; but a threaded kernel is free
      # to partition a reduction differently between two calls, and then the last bit moves
      # for reasons that have nothing to do with the claim. That is what these runners did:
      # the same commit failed three such comparisons on one run and passed them on a re-run,
      # and only on the cases with 26x26 mode matrices or larger.
      #
      # (Differing runner CPU models cannot explain it on their own: both results in each of
      # those comparisons are computed in one process on one machine, so a SIMD kernel chosen
      # per CPU applies equally to both.)
      #
      # Nothing here is large enough to want threads -- the biggest mode matrix in the suite
      # is a few hundred square -- so this costs no wall-clock worth measuring.
      - name: Run verification suite
        env:
          OPENBLAS_NUM_THREADS: 1
          OMP_NUM_THREADS: 1
          MKL_NUM_THREADS: 1
          NUMEXPR_NUM_THREADS: 1
          VECLIB_MAXIMUM_THREADS: 1
          # XLA's own thread pool, which none of the five above reach -- they set BLAS and
          # OpenMP counts and XLA:CPU is neither. It deadlocks on these two-core runners:
          # `probes` in run 33869683436 watched `test_a_frozen_geometry_makes_a_shape_parameter
          # _traceable[ellipse lx]` sit at 1195 MiB of resident set, unchanging, for three
          # minutes, with 5958 MiB still available. Nothing was being allocated and nothing
          # was short; the process was stuck. With this flag the same three cases pass in 91
          # seconds.
          #
          # Job-wide because it has to be: XLA reads it when the backend initialises, so it
          # cannot be scoped to a test. That is the right scope anyway -- the stall was never
          # specific to this test. It moved between parametrisations run to run, so any
          # jit-of-grad in the suite could reach it, and most of the jax tests are that.
          #
          # It should not move a number. Serialising a reduction makes it more reproducible,
          # not less, which is the same direction the five above are set for.
          XLA_FLAGS: --xla_cpu_multi_thread_eigen=false
        #
        # The recorder retains the parallel ordinary phase, then runs the source-writing
        # boundary/Gamma tests serially in a byte-checked copy. loadfile alone cannot
        # isolate a temporary edit from a different worker reading the same checkout.
        #
        # Two workers, because the runner has two cores and every thread count above pins
        # this process to one of them. The suite spent 77 minutes using half the machine.
        # `--dist loadfile` keeps a file's tests on one worker, which matters here: several
        # files set process-wide state at import -- `test_boundary.py` turns on
        # `JAX_ENABLE_X64` and `test_fp_warnings.py` reasons explicitly about what has been
        # imported by the time it runs -- and per-test distribution would scatter that.
        #
        # Verified before landing rather than after: the whole suite under `-n 2 --dist
        # loadfile` locally gives 3946 passed, 39 skipped, 1 xfailed, nothing failed. That
        # is the claim worth checking, since the speedup is arithmetic and the breakage
        # would not be.
        #
        # The six tests that cost 32 of those 77 minutes -- four in `test_boundary.py`, two in
        # `test_oblique_lattice.py` -- were marked slow on 2026-09-15 and are back in this tier
        # since 2026-10-14: each now states the small shape-NVF grid its assertion cannot
        # tell from the default, and none takes more than 11 s. The default grid is what made
        # them slow -- f453b21 folds polygon segments over the 3x3 periodic images, which is
        # 9x the segments and is correctness work, not a regression to revert.
        #
        # `--timeout` turns a hung test into a named failure instead of a dead job.
        # Without it the run that hangs reports nothing at all: pytest prints its
        # summary at the end, so when GitHub cancels the job at the six-hour mark
        # every failure the run had already found is lost with it. That is not
        # hypothetical -- run 33656262958 stalled at 43% and took two real assertion
        # failures down with it, and neither the stuck test nor the failing ones are
        # named anywhere in its log.
        #
        # The `signal` method is chosen, not inherited. `thread` dumps every stack
        # and then calls `os._exit`, which kills the whole run at the first stuck
        # test -- the same dead job, only faster. `signal` raises inside the test, so
        # the run carries on and the summary still arrives. The cost is that SIGALRM
        # is only delivered when the interpreter is reachable, which is why the job
        # keeps a `timeout-minutes` above it.
        #
        # 1200s is deliberately far above anything here rather than merely above it.
        # The slowest single test in the suite is 63 seconds on a developer machine,
        # but these runners are not that machine -- one 72-test block took 30 minutes,
        # a mean of 25 seconds a test -- and a bound that fires on a slow test rather
        # than a stuck one would be a false red mark on a healthy commit.
        #
        # `--verbose --live-output` retains pytest -v in the log and CI console.
        # This is the part that actually diagnoses a hang. `-q`
        # prints one character per test and flushes a line every 72 of them, so a
        # job killed mid-line names none of the 72 -- run 33656262958 and run
        # 33715389225 both died that way, and recovering even the *identity* of what
        # failed took rebuilding pytest's collection order offline and matching it
        # against the skip pattern. `-v` writes the node id *before* running the test
        # and flushes, so the last line of a killed log is the stuck test by name,
        # and every failure is named inline as it happens rather than in a summary
        # that a killed run never reaches.
        #
        # `thread`, not `signal`, and this is a retreat from a choice made one commit
        # ago. `signal` was chosen so a stuck test would fail and let the run carry
        # on; on run 33715389225 it sat through 2h05m of stall without firing once,
        # which says the interpreter never becomes reachable there -- the alarm is
        # set, and no bytecode boundary ever arrives to deliver it. `thread` watches
        # from a second thread that the main thread cannot block, dumps every
        # thread's stack, and exits. That ends the run, which is why it was rejected
        # before; with `-v` above, every failure up to that point is already in the
        # log, so the objection no longer holds. What it buys is the one thing still
        # missing: *where* the process is stuck, not merely which test was running.
        #
        # There was a deselect here for four days, and the history is worth keeping
        # because the first two diagnoses of it were wrong. Run 33730652133 named
        # `test_a_frozen_geometry_makes_a_shape_parameter_traceable` as the test that
        # hangs -- stalled in `float(jax.jit(jax.grad(total))(x))` -- and `thread` ends
        # the run there, so everything after it in collection order went unrun. That
        # was not a small blind spot: the parametric refactor had renamed
        # `test_analytic.py` to `test_parametric.py`, moving two known failures from
        # before this point to after it, and the run reported zero failures with both
        # still sitting there.
        #
        # The deselect is gone, and with it the last of this investigation. Two separate
        # failures wore one symptom here. `ellipse lx`, `rectangle lx` and `rectangle
        # angle` were a deadlock in XLA's multi-threaded Eigen, which the `XLA_FLAGS`
        # line above removes -- they came back at 91 seconds once it was set.
        # `overlapping pair` was not that: it asked for 11559862304 bytes on a 7.9 GB
        # runner, and this comment used to say "no flag will change that", which was
        # true and beside the point. The request was never the physics. The chunking in
        # `boundary.distance_gradient_normal_field` did not survive tracing -- a Python
        # loop is one copy of the body per chunk, and reverse mode holds them all -- so
        # with `lax.scan` and a rematerialised body the same solve asks for 0.570 GiB
        # and the whole function passes, measured at 2202 MB against this runner's 7.9.
        #
        # `-m "not slow and not research"`: the tests marked slow run in their own job, `slow` below, and
        # the two jobs together are the whole suite. Measured 2026-09-15 on the desktop under
        # `-n 5`, the FDTD line's full suite was 97 minutes of wall clock and 484
        # worker-minutes, and 74 cases took 281 of those. the trunk's own runs take 27 minutes
        # there and 65 to 78 here, and by that ratio this job was headed for about 260 minutes
        # against the 180 above. Split, this half took 42 minutes on the desktop, which is
        # roughly 100 to 120 here by the same ratio.
        run: >
          python -u tools/run_verification.py --profile full --slow exclude
          --shard ${{ matrix.shard }}/6
          --workers 2 --timeout 1200 --timeout-method thread --verbose --live-output
          --output artifacts/verification/default

      # Keep receipts and partial logs after failures without uploading source copies,
      # pytest caches or temporary fixtures. Each phase writes its reports at one level.
      - name: Upload verification evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: verification-default-${{ matrix.shard }}
          path: |
            artifacts/verification/default/*.json
            artifacts/verification/default/*/*.json
            artifacts/verification/default/*/*.jsonl
            artifacts/verification/default/*/*.xml
            artifacts/verification/default/*/*.log
            !artifacts/verification/default/snapshot/**
          if-no-files-found: warn
          retention-days: 14

  # The shards are only a verification of the suite together. This job reads the six
  # receipts and fails unless every shard is present once, all collected the same list,
  # the lists partition it, and every shard exited 0 -- `tools/verify_shards.py`. It runs
  # whether or not the shards passed (`always()`), so a shard that was cancelled or whose
  # runner died is a named failure here rather than a job that silently never reported.
  test-complete:
    name: full backends complete
    runs-on: ubuntu-latest
    needs: test
    if: ${{ always() && (github.event_name != 'pull_request' || !github.event.pull_request.draft) }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v7
        with:
          pattern: verification-default-*
          path: shards
      - name: The six shards must add up to the whole partition
        run: python tools/verify_shards.py --count 6 shards/verification-default-*/

  slow:
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    name: slow tests (${{ matrix.shard }}/2)
    runs-on: ubuntu-latest
    # Two shards for the same reason `test` has six: the runner's memory, not the clock.
    # Unsharded, this job reached 90 % (147 passed, 0 failed) before the runner shut itself
    # down on run 38574993959; as two shards on run 38727516339 both finished, in 38 and 39
    # minutes. `slow-complete` below checks the two shards add up.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    # A healthy slow shard is about 40 minutes (above); this is for a hang.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip

      # The same installation as `test`, for the same reasons given there.
      - name: Install CPU-only PyTorch
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Install Wavebit with both optional backends, contour, and plotting
        run: pip install -e '.[jax,pytorch,contour,plot]' pytest pytest-timeout pytest-xdist

      - name: Verify all three backends and contourpy are importable
        run: python -c "import numpy, jax, torch, contourpy, matplotlib, wavebit; print(wavebit.__file__)"

      # The environment is `test`'s, and the comments there are the reasons for it. What
      # differs is the per-test bound, 2400 s rather than 1200 s. The slowest of these took
      # 752 s at `-n 5` on the desktop, and 1110 s on another run, where 1200 s killed its
      # worker. These runners are slower than that machine, and the bound is for a hung test,
      # not a slow one.
      - name: Run the slow tests
        env:
          OPENBLAS_NUM_THREADS: 1
          OMP_NUM_THREADS: 1
          MKL_NUM_THREADS: 1
          NUMEXPR_NUM_THREADS: 1
          VECLIB_MAXIMUM_THREADS: 1
          XLA_FLAGS: --xla_cpu_multi_thread_eigen=false
        run: >
          python -u tools/run_verification.py --profile full --slow only
          --shard ${{ matrix.shard }}/2
          --workers 2 --timeout 2400 --timeout-method thread --verbose --live-output
          --output artifacts/verification/slow

      # Keep receipts and partial logs after failures without uploading source copies,
      # pytest caches or temporary fixtures. Each phase writes its reports at one level.
      - name: Upload verification evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: verification-slow-${{ matrix.shard }}
          path: |
            artifacts/verification/slow/*.json
            artifacts/verification/slow/*/*.json
            artifacts/verification/slow/*/*.jsonl
            artifacts/verification/slow/*/*.xml
            artifacts/verification/slow/*/*.log
            !artifacts/verification/slow/snapshot/**
          if-no-files-found: warn
          retention-days: 14

  slow-complete:
    name: slow tests complete
    runs-on: ubuntu-latest
    needs: slow
    if: ${{ always() && (github.event_name != 'pull_request' || !github.event.pull_request.draft) }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v7
        with:
          pattern: verification-slow-*
          path: shards
      - name: The two shards must add up to the whole slow partition
        run: python tools/verify_shards.py --count 2 shards/verification-slow-*/

  examples:
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    name: examples smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip

      # Same reason as in `test`: get the CPU wheel in before the extras can pull
      # the CUDA one.
      - name: Install CPU-only PyTorch
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu

      # Both backends, because `shapes_1d` solves on torch,
      # `shapes_2d` on jax, and the two `_verification` ones run all three.
      # The FDTD recording example also exercises the optional plot extra.
      - name: Install Wavebit with both optional backends
        run: pip install -e '.[jax,pytorch,plot]'

      # Runs every examples/**/*.py from its own directory under MPLBACKEND=Agg and
      # fails on a non-zero exit or a `Traceback`.
      #
      # This says the examples still RUN, and nothing about whether their numbers are
      # right -- there is no per-scene expected value here to compare against. It used
      # to also fail on an `UnphysicalResultWarning`; that check was removed from the
      # solver (docs/reference/common/result-guards.md). The physics is checked in tests/.
      - name: Run every example
        run: python tools/run_examples_smoke.py

      - name: Run current API tutorial notebooks in fresh interpreters
        run: python tools/run_tutorials_smoke.py

  minimal:
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    name: distribution (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.12']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install distribution tooling
        run: python -m pip install build twine
      - name: Build and exercise an isolated installed distribution
        run: python tools/run_distribution_smoke.py --output "${{ runner.temp }}/wavebit-distribution"

  docs:
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    name: docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip

      # The package itself, because autodoc imports it to read the docstrings -- NumPy only,
      # since nothing on the public surface needs an optional backend to be introspected.
      - name: Install Wavebit and the docs extra
        run: pip install -e '.[docs]'

      # `-W` turns every warning into a failure, and that is the whole check rather than a
      # tidiness preference. `docs/reference/api.md` names objects by hand, and autodoc
      # reports a name it cannot import as a warning -- so with `-W`, a public symbol that is
      # renamed or moved fails this job instead of leaving a quietly shorter page. It also
      # catches a dead cross-reference and a `_toc.yml` entry with no file. The build is at
      # zero warnings, which is what makes the switch usable.
      - name: Build English and Korean sites, warnings as errors
        run: |
          python -m sphinx -W -b html -D wavebit_bilingual=1 -d docs/_build/doctrees/en docs docs/_build/html
          python -m sphinx -W -b html -D wavebit_bilingual=1 -D language=ko -d docs/_build/doctrees/ko docs docs/_build/html/ko
