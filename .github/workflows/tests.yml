# Diagnostic-only branch: never merge this workflow replacement into main.
# This run is experimental evidence, not the product CI gate.
name: JAX CPU grouped-call diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    name: macOS JAX ${{ matrix.jax }} (${{ matrix.threads }})
    runs-on: macos-latest
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        include:
          - jax: '0.11.0'
            numpy: '2.5.1'
            scipy: '1.18.0'
            threads: ci
            xla: '--xla_cpu_multi_thread_eigen=false'
          - jax: '0.12.0.1'
            numpy: '2.5.5'
            scipy: '1.18.1'
            threads: ci
            xla: '--xla_cpu_multi_thread_eigen=false'
          - jax: '0.12.0.1'
            numpy: '2.5.5'
            scipy: '1.18.1'
            threads: default-xla
            xla: ''
    env:
      PYTHONPATH: src
      PYTHONIOENCODING: utf-8
      JAX_PLATFORMS: cpu
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      XLA_FLAGS: ${{ matrix.xla }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install diagnostic dependencies
        run: python -m pip install "jax==${{ matrix.jax }}" "jaxlib==${{ matrix.jax }}" "numpy==${{ matrix.numpy }}" "scipy==${{ matrix.scipy }}" array-api-compat==1.16.0
      - name: Compare original grouping and separate calls
        shell: bash
        run: |
          mkdir -p artifacts/grouped-call
          python - <<'PY'
          import json, platform, subprocess, sys
          from pathlib import Path
          root = Path('artifacts/grouped-call')
          base = Path('studies/rcwa/nvf_fitting_grid')
          cases = [
              ('centre-plus-joined', []),
              ('centre-minus-joined', ['--offset=-.1']),
              ('centre-plus-separate', ['--execution=separate']),
              ('centre-minus-separate', ['--execution=separate', '--offset=-.1']),
              ('jacobian-joined', ['--mode=jacobian', '--offset=0']),
              ('jacobian-separate', ['--mode=jacobian', '--offset=0', '--execution=separate']),
          ]
          codes = {}
          for name, args in cases:
              print('START', name, flush=True)
              with (root/(name+'.log')).open('w', encoding='utf-8') as log:
                  codes[name] = subprocess.call([sys.executable, str(base/'jit_groups_guard.py'),
                      str(root/(name+'.guard.json')), sys.executable, str(base/'jit_groups_diagnostic.py'),
                      '--output', str(root/(name+'.json')), *args], stdout=log, stderr=subprocess.STDOUT)
              print('END', name, codes[name], flush=True)
          receipt = dict(exit_codes=codes, platform=platform.platform(), machine=platform.machine())
          import numpy as np
          comparisons = {}
          for name in ('centre-plus', 'centre-minus', 'jacobian'):
              if codes[name+'-joined'] or codes[name+'-separate']:
                  continue
              a = json.loads((root/(name+'-joined.json')).read_text(encoding='utf-8'))['repeats'][0]
              b = json.loads((root/(name+'-separate.json')).read_text(encoding='utf-8'))['repeats'][0]
              comparisons[name] = {}
              for key, rtol, atol in [('values', 1e-10, 1e-12), ('jacobian', 1e-8, 1e-11)]:
                  if a[key] is None:
                      continue
                  comparisons[name][key] = dict(max_abs=float(np.max(np.abs(np.asarray(a[key])-b[key]))),
                      passed=bool(np.allclose(a[key], b[key], rtol=rtol, atol=atol)))
          receipt['comparisons'] = comparisons
          (root/'receipt.json').write_text(json.dumps(receipt, indent=2)+'\n', encoding='utf-8')
          print(json.dumps(receipt, indent=2), flush=True)
          assert not any(codes.values())
          assert all(v['passed'] for row in comparisons.values() for v in row.values())
          PY
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: grouped-call-macos-jax-${{ matrix.jax }}-${{ matrix.threads }}
          path: artifacts/grouped-call/
