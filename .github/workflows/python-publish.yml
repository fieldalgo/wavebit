# Publishes the package to PyPI when a GitHub release is published -- pre-releases included:
# a release tagged `v0.1.0a1` uploads `0.1.0a1`, which PyPI lists as a pre-release and pip
# installs only when asked (`pip install --pre wavebit`). Authentication is PyPI trusted
# publishing (OIDC): no API token is stored anywhere. PyPI must list this repository as a
# publisher of the `wavebit` project: owner `fieldalgo`, repository `wavebit`, workflow
# `python-publish.yml`, environment `pypi`.
#
# The job refuses to upload when the release tag does not spell the version in pyproject.toml,
# so a tag cannot publish a different version than the one it names, and it waits for
# `release-gate.yml`: nothing is uploaded unless `tests` already passed on the release commit.

name: Upload Python Package

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  gate:
    uses: ./.github/workflows/release-gate.yml
    permissions:
      actions: read

  deploy:
    needs: gate
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write          # trusted publishing: PyPI verifies this workflow's OIDC token
      contents: read

    steps:
    - uses: actions/checkout@v7
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.x'
    - name: The release tag must name the version pyproject.toml declares
      run: |
        python - "${GITHUB_REF_NAME}" <<'PY'
        import re, sys, tomllib
        tag = sys.argv[1]
        version = tomllib.load(open('pyproject.toml', 'rb'))['project']['version']
        if tag.lstrip('v') != version:
            sys.exit(f'release tag {tag!r} does not match pyproject version {version!r}; '
                     f'bump pyproject.toml (and tag v{version}) or retag')
        print(f'tag {tag} == version {version}')
        PY
    - name: Build package
      run: |
        python -m pip install --upgrade pip build
        python -m build
    - name: Publish package
      # Referenced by tag, not by commit: this action pulls a prebuilt container image named after
      # the ref it was invoked with, and a bare SHA has no image ("manifest unknown").
      uses: pypa/gh-action-pypi-publish@v1.14.2
