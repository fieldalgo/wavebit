<svg xmlns="http://www.w3.org/2000/svg" width="860" height="430" viewBox="0 0 860 430" role="img" aria-labelledby="title desc">
<title id="title">Structure input routing</title><desc id="desc">An array selects raster. A list of dictionaries selects parametric geometry. Nonintersecting shapes add their transforms; overlaps are resolved into polygons per layer.</desc>
<rect width="860" height="430" fill="white"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#5d7385"/></marker></defs>
<g font-family="sans-serif" font-size="19" fill="#172b3d" text-anchor="middle">
<g fill="#ecf5f2" stroke="#b5d7cd"><rect x="325" y="20" width="210" height="55" rx="8"/><rect x="55" y="160" width="300" height="90" rx="8"/><rect x="485" y="160" width="320" height="70" rx="8"/><rect x="295" y="330" width="250" height="78" rx="8"/><rect x="575" y="330" width="250" height="78" rx="8"/></g>
<text x="430" y="55" font-weight="700">structure</text>
<g stroke="#5d7385" stroke-width="2" fill="none" marker-end="url(#arrow)"><path d="M390 75L205 158"/><path d="M470 75L645 158"/><path d="M600 230L420 328"/><path d="M690 230L700 328"/></g>
<text x="220" y="117" font-size="16">ndarray</text><text x="645" y="117" font-size="16">list of dict</text>
<text x="205" y="193" font-weight="700">Raster</text><text x="205" y="225" font-size="17">one permittivity per pixel</text>
<text x="645" y="189" font-weight="700">Parametric shapes</text><text x="645" y="216" font-size="16">Do shapes intersect in this layer?</text>
<text x="474" y="274" font-size="16">no</text><text x="725" y="284" font-size="16">yes</text>
<text x="420" y="360" font-size="17">Add each shape's</text><text x="420" y="386" font-size="17">Fourier transform</text>
<text x="700" y="360" font-size="17">Resolve overlap into</text><text x="700" y="386" font-size="17">polygons, then transform</text>
</g></svg>
