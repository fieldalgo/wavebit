<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 720" role="img" aria-labelledby="coordinates-title coordinates-desc">
<title id="coordinates-title">Reading coordinates and layer order</title>
<desc id="coordinates-desc">Axes, the cell-centred origin and layer order are shared by raster and shape inputs. The left xy diagram overlays a 4-by-4 raster example; its monochrome grid indicates row and column locations, not material values. Row 0 lies toward negative y, and the origin is at the cell centre. This right-handed frame has x rightward, y upward and z out of the page. The right diagram shows two layers without their material patterns. Grey does not denote material; their thicknesses are d0 and d1. Height increases from the bottom at z=0.</desc>
<defs><marker id="coord-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#435466" /></marker></defs>
<style>
text { font-family: -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif; fill:#182b3e; }
.axis { stroke:#435466; stroke-width:2; marker-end:url(#coord-arrow); }
.dimension { stroke:#657584; stroke-width:1.6; marker-start:url(#coord-arrow); marker-end:url(#coord-arrow); }
</style>
<rect width="1000" height="720" fill="white" />

