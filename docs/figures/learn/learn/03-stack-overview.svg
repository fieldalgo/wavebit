<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="stack-title stack-desc">
<title id="stack-title">Periodic patterns, stacked layers and incident light</title>
<desc id="stack-desc">Perspective schematic of two layers on an orthogonal lattice. One cell repeats in x and y, with the first layer below the second. The structure begins at z=0. Light enters obliquely from above, with a negative z propagation component. theta is the angle between propagation and the inward normal −z; phi is the angle between the xy projection and +x. The pale plane of incidence is not a material.</desc>
<defs>
<marker id="dark-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#42566b" /></marker>
<marker id="light-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#c44738" /></marker>
<marker id="gold-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#a86508" /></marker>
</defs>
