<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 58 1000 612" role="img" aria-labelledby="title desc">
<title id="title">Electric and magnetic directions; power through a surface</title><desc id="desc">Left: an upward-propagating linearly polarized plane wave in a lossless isotropic nonmagnetic medium. Right: an xz section including top, finite layers and bot. Bottom incidence travels from bot toward the lowest layer. Its power density through the entrance interface equals the incident flux magnitude times cos(theta).</desc>
<style>text{font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;fill:#182b3e;font-size:20px}</style>
<rect width="1000" height="670" fill="white" />
<rect x="24" y="78" width="458" height="550" rx="12" fill="#f6fafc" stroke="#cad7df" stroke-width="1.5" />
<rect x="500" y="78" width="476" height="550" rx="12" fill="#f6fafc" stroke="#cad7df" stroke-width="1.5" />
<text x="48" y="116" text-anchor="start" style="font-size:24px;fill:#182b3e;font-weight:650">① Electric, magnetic and propagation directions</text>
<text x="48" y="148" text-anchor="start" style="font-size:18px;fill:#546779;font-weight:400">Normal incidence from below · fields at one instant</text>
<line x1="170" y1="355" x2="170.0" y2="220.0" stroke="#117c77" stroke-width="5" />
<polygon points="170,205 177.0,220.0 163.0,220.0" fill="#117c77" />
<line x1="170" y1="355" x2="390.0" y2="355.0" stroke="#2d60a1" stroke-width="5" />
<polygon points="405,355 390.0,362.0 390.0,348.0" fill="#2d60a1" />
<text x="170" y="190" text-anchor="middle" style="font-size:18px;fill:#546779;font-weight:400">+z</text>
<text x="420" y="362" text-anchor="start" style="font-size:18px;fill:#546779;font-weight:400">+x</text>
<text x="135" y="362" text-anchor="end" style="font-size:18px;fill:#546779;font-weight:400">+y</text>
<text x="192" y="224" text-anchor="start" style="font-size:23px;fill:#117c77;font-weight:600">k, ⟨S⟩</text>
<text x="192" y="256" text-anchor="start" style="font-size:19px;fill:#117c77;font-weight:400">Propagation upward</text>
<text x="285" y="333" text-anchor="start" style="font-size:23px;fill:#2d60a1;font-weight:600">e(t)</text>
<circle cx="170" cy="355" r="14" fill="white" stroke="#b56626" stroke-width="3" />
<line x1="163" y1="348" x2="177" y2="362" stroke="#b56626" stroke-width="3" />
<line x1="163" y1="362" x2="177" y2="348" stroke="#b56626" stroke-width="3" />
<text x="91" y="405" text-anchor="start" style="font-size:21px;fill:#b56626;font-weight:600">⊗ h(t): into the page</text>
<text x="91" y="439" text-anchor="start" style="font-size:19px;fill:#182b3e;font-weight:400">e(t) × h(t) points upward.</text>
<rect x="48" y="470" width="410" height="126" rx="10" fill="#e8f1f9" stroke="none" stroke-width="1.5" />
<text x="70" y="504" text-anchor="start" style="font-size:20px;fill:#182b3e;font-weight:600">Refractive index n sets magnetic amplitude</text>
<text x="253" y="544" text-anchor="middle" style="font-size:26px;fill:#2d60a1;font-weight:400">|H| = (n / Z₀) |E|</text>
<text x="253" y="576" text-anchor="middle" style="font-size:18px;fill:#182b3e;font-weight:400">At the same |E|, larger n gives larger |H|.</text>
<text x="524" y="116" text-anchor="start" style="font-size:24px;fill:#182b3e;font-weight:650">② Power crossing the entrance interface</text>
<text x="524" y="148" text-anchor="start" style="font-size:18px;fill:#546779;font-weight:400">Oblique incidence from below · xz section</text>
<text x="620" y="180" text-anchor="start" style="font-size:18px;fill:#546779;font-weight:400">top</text>
<rect x="620" y="190" width="324" height="40" rx="0" fill="#dce8f2" stroke="#cad7df" stroke-width="1.5" />
<text x="782" y="217" text-anchor="middle" style="font-size:19px;fill:#182b3e;font-weight:600">First layer</text>
<rect x="620" y="230" width="324" height="40" rx="0" fill="#edf2f5" stroke="#cad7df" stroke-width="1.5" />
<text x="782" y="257" text-anchor="middle" style="font-size:19px;fill:#182b3e;font-weight:600">⋯</text>
<rect x="620" y="270" width="324" height="40" rx="0" fill="#dce8f2" stroke="#cad7df" stroke-width="1.5" />
<text x="782" y="297" text-anchor="middle" style="font-size:19px;fill:#182b3e;font-weight:600">Lowest layer</text>
<path d="M 614 190 H 606 V 310 H 614" fill="none" stroke="#546779" stroke-width="2" />
<text x="540" y="234" text-anchor="start" style="font-size:19px;fill:#182b3e;font-weight:600">Structure</text>
<text x="528" y="263" text-anchor="start" style="font-size:17px;fill:#546779;font-weight:400">Stacked layers</text>
<text x="620" y="340" text-anchor="start" style="font-size:18px;fill:#546779;font-weight:400">bot</text>
<line x1="705" y1="440" x2="705.0" y2="325.0" stroke="#745e97" stroke-width="5" />
<polygon points="705,310 712.0,325.0 698.0,325.0" fill="#745e97" />
<line x1="705" y1="440" x2="843.6646637581528" y2="319.8239580762676" stroke="#117c77" stroke-width="5" />
<polygon points="855,310 848.2491775270777,325.11378165579634 839.0801499892278,314.5341344967389" fill="#117c77" />
<text x="842" y="362" text-anchor="start" style="font-size:26px;fill:#117c77;font-weight:600">⟨S⟩</text>
<text x="816" y="394" text-anchor="start" style="font-size:20px;fill:#117c77;font-weight:400">Incident wave</text>
<text x="679" y="377" text-anchor="end" style="font-size:26px;fill:#745e97;font-weight:600">I<tspan baseline-shift="sub" style="font-size:70%">⊥</tspan></text>
<text x="679" y="407" text-anchor="end" style="font-size:19px;fill:#745e97;font-weight:400">Normal component</text>
<text x="679" y="433" text-anchor="end" style="font-size:18px;fill:#546779;font-weight:400">+z</text>
<path d="M 705 388 A 52 52 0 0 1 744.2958323050705 405.94361200227223" fill="none" stroke="#117c77" stroke-width="2.5" />
<text x="724" y="382" text-anchor="start" style="font-size:27px;fill:#117c77;font-weight:400">θ</text>
<path d="M 705 324 L 719 324 L 719 310" fill="none" stroke="#879ba9" stroke-width="1.5" />
<rect x="524" y="470" width="428" height="126" rx="10" fill="#f1edf7" stroke="none" stroke-width="1.5" />
<text x="546" y="504" text-anchor="start" style="font-size:20px;fill:#182b3e;font-weight:600">cos θ: projection onto the normal</text>
<text x="738" y="544" text-anchor="middle" style="font-size:26px;fill:#745e97">I<tspan baseline-shift="sub" style="font-size:70%">⊥</tspan><tspan baseline-shift="baseline"> = |⟨S⟩| cos θ</tspan></text>
<text x="738" y="576" text-anchor="middle" style="font-size:18px;fill:#182b3e;font-weight:400">At θ = 0°, the full power flow crosses the surface.</text>
<text x="500" y="656" text-anchor="middle" style="font-size:17px;fill:#546779;font-weight:400">Lossless isotropic nonmagnetic incident medium · only incident wave shown · arrow lengths do not compare magnitudes.</text>
</svg>