<text x="555" y="589" style="fill:#a85116;font-size:23px;font-weight:650" text-anchor="start">b₁ points down and right (−30°)</text>
<text x="30" y="674" style="fill:#182b3e;font-size:22px;font-weight:650" text-anchor="start">Distinguish motion along a cell vector (a₁) from the direction normal to phase lines (b₁).</text>
<text x="30" y="693" style="fill:#546779;font-size:16px;font-weight:400" text-anchor="start">Lines show equal phase of the (1,0) component, not material interfaces · +x right, +y up</text>
