<title id="06c-phase-lines-title">Why is b₁ perpendicular to a₂?</title><desc id="06c-phase-lines-desc">Equal-phase lines of the (1,0) Fourier component run parallel to a₂. They are vertical in an orthogonal cell, so b₁ points right; in a 60° cell they tilt, and b₁ points down and right.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#546779" /></marker></defs>
