<text x="30" y="37" style="fill:#182b3e;font-size:24px;font-weight:650" text-anchor="start">Why is b₁ perpendicular to a₂?</text>
<text x="30" y="82" style="fill:#182b3e;font-size:22px;font-weight:400" text-anchor="start">Phase is constant along each line · both diagrams use physical xy coordinates</text>
