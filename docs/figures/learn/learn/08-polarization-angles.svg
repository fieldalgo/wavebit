<text x="288" y="219" class="" text-anchor="start" style="fill:#b45b18">ψ</text>
<text x="356" y="217" class="small" text-anchor="start" style="fill:#087d78">Major radius</text>
<line x1="348.00" y1="222.00" x2="331.00" y2="240.00" stroke="#087d78" stroke-width="1.5" />
<text x="351" y="364" class="small" text-anchor="start" style="fill:#b45b18">Minor radius</text>
<line x1="346.00" y1="352.00" x2="320.00" y2="335.00" stroke="#b45b18" stroke-width="1.5" />
<text x="64" y="479" class="small" text-anchor="start">ψ: angle from p to the major axis, toward s</text>
<text x="550" y="149" class="small" text-anchor="start">χ is not an angle measured directly on this drawing.</text>
<text x="550" y="190" class="" text-anchor="start">|tan χ| = minor radius / major radius</text>
<text x="550" y="239" class="head" text-anchor="start">χ = 0°</text>
<text x="550" y="268" class="small" text-anchor="start">Zero minor radius → linear</text>
<text x="550" y="307" class="head" text-anchor="start">0° &lt; |χ| &lt; 45°</text>
<text x="550" y="336" class="small" text-anchor="start">Unequal nonzero radii → elliptical</text>
<text x="550" y="375" class="head" text-anchor="start">|χ| = 45°</text>
<text x="550" y="404" class="small" text-anchor="start">Equal radii → circular</text>
<text x="550" y="456" class="small" text-anchor="start">Reversing the sign of χ reverses the rotation.</text>
<text x="30" y="552" class="small" text-anchor="start">Enter radians in code. Example: 30° → np.deg2rad(30.)</text>
</svg>