<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 585" role="img" aria-labelledby="title desc">
<title id="title">psi sets the major-axis direction; chi sets the ellipse shape</title><desc id="desc">psi is measured from p toward s. The diagram marks the major and minor radii; their ratio, minor/major, equals abs(tan(chi)).</desc>
<defs>
<marker id="axis" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#526879" /></marker>
<marker id="trace" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#087d78" /></marker>
<marker id="field" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#b45b18" /></marker>
</defs>
<style>text{font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;fill:#162d43;font-size:21px}.small{font-size:18px;fill:#526879}.code{font-family:ui-monospace,SFMono-Regular,monospace;font-size:20px}.title{font-size:29px;font-weight:700}.head{font-size:25px;font-weight:650}</style>
<rect width="1100" height="585" fill="white" />
<text x="30" y="45" class="title" text-anchor="start">ψ sets the major axis; χ sets the shape</text>
<text x="30" y="80" class="small" text-anchor="start">Example ψ = 30° · minor/major radius = 1/2</text>
