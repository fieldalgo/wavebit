<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 412" role="img" aria-labelledby="title desc">
<title id="title">Vary one resolution at a time</title><desc id="desc">Fourier mode count and normal-field integration grid control different errors.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#546779" /></marker></defs>
<style>text{font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;fill:#182b3e;font-size:20px} .small{font-size:17px;fill:#546779}.formula{font-family:ui-monospace,SFMono-Regular,monospace;font-size:23px}</style>
<rect width="1000" height="412" fill="white" />
<text x="30" y="37" style="fill:#182b3e;font-size:24px;font-weight:650" text-anchor="start">Vary one resolution at a time</text>
<rect x="30" y="85" width="440" height="233" rx="10" fill="#e8f1ff" stroke="#cad7df" stroke-width="2" />
<text x="48" y="119" style="fill:#182b3e;font-size:22px;font-weight:650" text-anchor="start">A. Optical Fourier space</text>
<text x="48" y="155" style="fill:#182b3e;font-size:18px;font-weight:400" text-anchor="start">Fix shape_nvf_grid_size = 128</text>
<text x="48" y="182" style="fill:#182b3e;font-size:18px;font-weight:400" text-anchor="start">Orders (1,1) → (2,2) → (3,3)</text>
<text x="48" y="209" style="fill:#182b3e;font-size:18px;font-weight:400" text-anchor="start">Retain more electromagnetic modes.</text>
<text x="48" y="236" style="fill:#182b3e;font-size:18px;font-weight:400" text-anchor="start">Compare R, T, phase and the orders of interest.</text>
<rect x="520" y="85" width="450" height="233" rx="10" fill="#e5f4ef" stroke="#cad7df" stroke-width="2" />
<text x="538" y="119" style="fill:#182b3e;font-size:22px;font-weight:650" text-anchor="start">B. Shape-projector coefficient integration</text>
<text x="538" y="155" style="fill:#182b3e;font-size:18px;font-weight:400" text-anchor="start">Fix orders (3,3)</text>
<text x="538" y="182" style="fill:#182b3e;font-size:18px;font-weight:400" text-anchor="start">shape_nvf_grid_size 64 → 128 → 256</text>
<text x="538" y="209" style="fill:#182b3e;font-size:18px;font-weight:400" text-anchor="start">Assemble the same finite optical space more accurately.</text>
<text x="538" y="236" style="fill:#182b3e;font-size:18px;font-weight:400" text-anchor="start">For optimization, compare gradients too.</text>
<text x="40" y="365" style="fill:#a85116;font-size:23px;font-weight:400" text-anchor="start">R + T ≈ 1 checks energy balance; it does not give error relative to the true solution.</text>
<text x="30" y="395" style="fill:#546779;font-size:16px;font-weight:400" text-anchor="start">These numbers form a short teaching ladder, not recommended convergence settings</text>
</svg>