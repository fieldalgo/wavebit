<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 429" role="img" aria-labelledby="title desc">
<title id="title">The differentiated calculation and its validation</title><desc id="desc">Compare autodiff with independent central differences at the same finite settings.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#546779" /></marker></defs>
<style>text{font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;fill:#182b3e;font-size:20px} .small{font-size:17px;fill:#546779}.formula{font-family:ui-monospace,SFMono-Regular,monospace;font-size:23px}</style>
<rect width="1000" height="429" fill="white" />
<text x="30" y="37" style="fill:#182b3e;font-size:24px;font-weight:650" text-anchor="start">The differentiated calculation and its validation</text>
<rect x="30" y="85" width="260" height="140" rx="10" fill="#f1f5f7" stroke="#cad7df" stroke-width="2" />
<text x="48" y="119" style="fill:#182b3e;font-size:22px;font-weight:650" text-anchor="start">Prepare concrete geometry</text>
<text x="48" y="155" style="fill:#182b3e;font-size:18px;font-weight:400" text-anchor="start">freeze_geometry()</text>
<text x="48" y="182" style="fill:#182b3e;font-size:18px;font-weight:400" text-anchor="start">Record discrete geometry choices</text>
<rect x="365" y="85" width="255" height="140" rx="10" fill="#e8f1ff" stroke="#cad7df" stroke-width="2" />
<text x="383" y="119" style="fill:#182b3e;font-size:22px;font-weight:650" text-anchor="start">Use material ε as a variable</text>
<text x="383" y="155" style="fill:#182b3e;font-size:18px;font-weight:400" text-anchor="start">JAX solve(geometry=...)</text>
<text x="383" y="182" style="fill:#182b3e;font-size:18px;font-weight:400" text-anchor="start">T(ε) → autodiff</text>
<rect x="705" y="85" width="265" height="140" rx="10" fill="#e5f4ef" stroke="#cad7df" stroke-width="2" />
<text x="723" y="119" style="fill:#182b3e;font-size:22px;font-weight:650" text-anchor="start">Gradient</text>
<text x="723" y="155" style="fill:#182b3e;font-size:18px;font-weight:400" text-anchor="start">dT / dε</text>
<text x="723" y="182" style="fill:#182b3e;font-size:18px;font-weight:400" text-anchor="start">Derivative at the current orders and grid</text>
<line x1="292" y1="155" x2="352" y2="155" stroke="#546779" stroke-width="2" />
<polygon points="352,155 342.0,159.0 342.0,151.0" fill="#546779" />
<line x1="622" y1="155" x2="692" y2="155" stroke="#546779" stroke-width="2" />
<polygon points="692,155 682.0,159.0 682.0,151.0" fill="#546779" />
<rect x="105" y="267" width="790" height="108" rx="10" fill="#fff1df" stroke="#cad7df" stroke-width="2" />
<text x="123" y="301" style="fill:#182b3e;font-size:22px;font-weight:650" text-anchor="start">Independent check: central differences with rebuilt geometry</text>
<text x="123" y="337" style="fill:#182b3e;font-size:18px;font-weight:400" text-anchor="start">[T(ε+h) − T(ε−h)] / (2h), compare both h and h/2</text>
<text x="30" y="412" style="fill:#546779;font-size:16px;font-weight:400" text-anchor="start">Finite-difference agreement checks derivative implementation; optical-order and spatial-integration convergence remain separate</text>
</svg>