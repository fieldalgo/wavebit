<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 468" role="img" aria-labelledby="title desc">
<title id="title">Ordinary NVF and advanced auxiliary cells</title><desc id="desc">Ordinary NVF does not require building triangular auxiliary cells.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#546779" /></marker></defs>
<style>text{font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;fill:#182b3e;font-size:20px} .small{font-size:17px;fill:#546779}.formula{font-family:ui-monospace,SFMono-Regular,monospace;font-size:23px}</style>
<rect width="1000" height="468" fill="white" />
<text x="30" y="37" style="fill:#182b3e;font-size:24px;font-weight:650" text-anchor="start">Ordinary NVF and advanced auxiliary cells</text>
<rect x="30" y="165" width="180" height="116" rx="10" fill="#f1f5f7" stroke="#cad7df" stroke-width="2" />
<text x="48" y="199" style="fill:#182b3e;font-size:22px;font-weight:650" text-anchor="start">Structure input</text>
<text x="48" y="235" style="fill:#182b3e;font-size:18px;font-weight:400" text-anchor="start">Materials · shapes</text>
<rect x="295" y="85" width="300" height="136" rx="10" fill="#e5f4ef" stroke="#cad7df" stroke-width="2" />
<text x="313" y="119" style="fill:#182b3e;font-size:22px;font-weight:650" text-anchor="start">Ordinary NVF</text>
<text x="313" y="155" style="fill:#182b3e;font-size:18px;font-weight:400" text-anchor="start">Boundary normals → projector coefficients</text>
<text x="313" y="182" style="fill:#182b3e;font-size:18px;font-weight:400" text-anchor="start">Combine with permittivity matrices</text>
<text x="313" y="209" style="fill:#182b3e;font-size:18px;font-weight:400" text-anchor="start">Runnable examples in this book</text>
<rect x="295" y="266" width="300" height="136" rx="10" fill="#fff1df" stroke="#cad7df" stroke-width="2" />
<text x="313" y="300" style="fill:#182b3e;font-size:22px;font-weight:650" text-anchor="start">Explicit auxiliary cell</text>
<text x="313" y="336" style="fill:#182b3e;font-size:18px;font-weight:400" text-anchor="start">Build a field basis from an auxiliary problem</text>
<text x="313" y="363" style="fill:#182b3e;font-size:18px;font-weight:400" text-anchor="start">Separate supported structures and assumptions</text>
<text x="313" y="390" style="fill:#182b3e;font-size:18px;font-weight:400" text-anchor="start">The user calls the corresponding API</text>
<rect x="700" y="165" width="265" height="116" rx="10" fill="#e8f1ff" stroke="#cad7df" stroke-width="2" />
<text x="718" y="199" style="fill:#182b3e;font-size:22px;font-weight:650" text-anchor="start">RCWA optical calculation</text>
<text x="718" y="235" style="fill:#182b3e;font-size:18px;font-weight:400" text-anchor="start">Modes · layer coupling → R, T</text>
<line x1="210" y1="199" x2="280" y2="154" stroke="#546779" stroke-width="2" />
<polygon points="280,154 273.75124561148846,162.7722898146412 269.4251848809805,156.04286201162878" fill="#546779" />
