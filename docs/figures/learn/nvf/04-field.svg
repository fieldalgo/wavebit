<text x="498" y="445" style="fill:#182b3e;font-size:18px;font-weight:400" text-anchor="start">Computed from J; extracts a selected component</text>
<text x="40" y="510" style="fill:#285ab0;font-size:22px;font-weight:400" text-anchor="start">Build equations using P → then solve for electric field E.</text>
<text x="30" y="543" style="fill:#546779;font-size:16px;font-weight:400" text-anchor="start">Roles of n → J → P · this does not imply that code always stores a separate J array</text>
