<text x="230" y="269" style="fill:#182b3e;font-size:19px;font-weight:400" text-anchor="middle">중심: 실제 법선 없음</text>
<text x="230" y="121" style="fill:#182b3e;font-size:20px;font-weight:400" text-anchor="middle">화살표 n: 경계에 수직</text>
<text x="230" y="410" style="fill:#182b3e;font-size:20px;font-weight:400" text-anchor="middle">J는 내부와 배경에도 구성</text>
<rect x="480" y="85" width="490" height="106" rx="10" fill="#e5f4ef" stroke="#cad7df" stroke-width="2"/>
<text x="498" y="119" style="fill:#182b3e;font-size:22px;font-weight:650" text-anchor="start">① n · 실제 경계 법선</text>
<text x="498" y="155" style="fill:#182b3e;font-size:18px;font-weight:400" text-anchor="start">도형 기하에서 구함. 전기장은 필요 없음.</text>
<line x1="725" y1="194" x2="725" y2="218" stroke="#546779" stroke-width="2"/>
<polygon points="725,218 721.0,208.0 729.0,208.0" fill="#546779"/>
<rect x="480" y="230" width="490" height="106" rx="10" fill="#e8f1ff" stroke="#cad7df" stroke-width="2"/>
<text x="498" y="264" style="fill:#182b3e;font-size:22px;font-weight:650" text-anchor="start">② J · 영역 전체의 보조벡터</text>
<text x="498" y="300" style="fill:#182b3e;font-size:18px;font-weight:400" text-anchor="start">경계의 분해 기준을 내부·배경으로 연장</text>
<line x1="725" y1="339" x2="725" y2="363" stroke="#546779" stroke-width="2"/>
<polygon points="725,363 721.0,353.0 729.0,353.0" fill="#546779"/>
<rect x="480" y="375" width="490" height="106" rx="10" fill="#fff1df" stroke="#cad7df" stroke-width="2"/>
<text x="498" y="409" style="fill:#182b3e;font-size:22px;font-weight:650" text-anchor="start">③ P · 투영 행렬</text>
<text x="498" y="445" style="fill:#182b3e;font-size:18px;font-weight:400" text-anchor="start">J로 계산. 선택한 성분을 뽑는 연산</text>
<text x="40" y="510" style="fill:#285ab0;font-size:22px;font-weight:400" text-anchor="start">P를 반영한 방정식을 구성한 다음 → 전기장 E를 구한다.</text>
<text x="30" y="543" style="fill:#546779;font-size:16px;font-weight:400" text-anchor="start">n → J → P의 역할을 구별한 개념도 · 코드가 항상 J 배열을 별도로 저장한다는 뜻은 아님</text>
</svg>