<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" role="img" aria-labelledby="title desc">
<title id="title">n은 경계 방향, J는 연장한 기준, P는 분해 연산</title><desc id="desc">도형에서 경계 법선을 구하고, 보조벡터와 투영 행렬을 만든 뒤 전기장을 계산한다.</desc>
