<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 525" role="img" aria-labelledby="title desc">
<title id="title">Wavebit의 NVF 행렬 조립</title><desc id="desc">유전율 계수와 방향 투영 계수를 합쳐 RCWA가 사용하는 재료 행렬을 만든다.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#546779"/></marker></defs>
<style>text{font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;fill:#182b3e;font-size:20px} .small{font-size:17px;fill:#546779}.formula{font-family:ui-monospace,SFMono-Regular,monospace;font-size:23px}</style>
<rect width="1000" height="525" fill="white"/>
<text x="30" y="37" style="fill:#182b3e;font-size:24px;font-weight:650" text-anchor="start">Wavebit의 NVF 행렬 조립</text>
<rect x="30" y="85" width="420" height="123" rx="10" fill="#e8f1ff" stroke="#cad7df" stroke-width="2"/>
<text x="48" y="119" style="fill:#182b3e;font-size:22px;font-weight:650" text-anchor="start">재료 Fourier 계수</text>
<text x="48" y="155" style="fill:#182b3e;font-size:18px;font-weight:400" text-anchor="start">A = C(ε),  B = C(1/ε)</text>
<text x="48" y="182" style="fill:#182b3e;font-size:18px;font-weight:400" text-anchor="start">Δ = A − B⁻¹</text>
<rect x="550" y="85" width="420" height="123" rx="10" fill="#e5f4ef" stroke="#cad7df" stroke-width="2"/>
<text x="568" y="119" style="fill:#182b3e;font-size:22px;font-weight:650" text-anchor="start">방향 Fourier 계수</text>
<text x="568" y="155" style="fill:#182b3e;font-size:18px;font-weight:400" text-anchor="start">Pxx, Pxy, Pyx, Pyy</text>
<text x="568" y="182" style="fill:#182b3e;font-size:18px;font-weight:400" text-anchor="start">Cij = C(Pij)</text>
<line x1="240" y1="210" x2="380" y2="262" stroke="#546779" stroke-width="2"/>
<polygon points="380,262 369.23300116148783,262.26783579200276 372.0184933983168,254.76843361592464" fill="#546779"/>
<line x1="760" y1="210" x2="620" y2="262" stroke="#546779" stroke-width="2"/>
<polygon points="620,262 627.9815066016831,254.76843361592464 630.7669988385121,262.26783579200276" fill="#546779"/>
<rect x="85" y="277" width="830" height="113" rx="10" fill="#f1f5f7" stroke="#cad7df" stroke-width="2"/>
<text x="103" y="311" style="fill:#182b3e;font-size:22px;font-weight:650" text-anchor="start">유한 행렬에서 대칭화한 곱</text>
<text x="103" y="347" style="fill:#182b3e;font-size:18px;font-weight:400" text-anchor="start">Kij = δij A − ½(Δ Cij + Cij Δ)</text>
<line x1="500" y1="391" x2="500" y2="425" stroke="#546779" stroke-width="2"/>
<polygon points="500,425 496.0,415.0 504.0,415.0" fill="#546779"/>
<text x="500" y="462" style="fill:#285ab0;font-size:25px;font-weight:400" text-anchor="middle">ConvMatrices = (Kxx, Kyy, A⁻¹, −Kxy, −Kyx)</text>
<text x="30" y="508" style="fill:#546779;font-size:16px;font-weight:400" text-anchor="start">비자성 · 스칼라 ε · z 방향으로 일정한 층 · 내부 슬롯 부호까지 표시</text>
</svg>