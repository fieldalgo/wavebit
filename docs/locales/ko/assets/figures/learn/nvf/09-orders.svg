<text x="446" y="260" style="fill:#182b3e;font-size:20px;font-weight:400" text-anchor="middle">(2,1)</text>
<text x="65" y="89" style="fill:#182b3e;font-size:20px;font-weight:400" text-anchor="start">열: m = −2, −1, 0, 1, 2</text>
<text x="65" y="328" style="fill:#182b3e;font-size:20px;font-weight:400" text-anchor="start">행: n = −1, 0, 1</text>
<rect x="550" y="105" width="415" height="180" rx="10" fill="#e8f1ff" stroke="#cad7df" stroke-width="2"/>
<text x="568" y="139" style="fill:#182b3e;font-size:22px;font-weight:650" text-anchor="start">truncation_order = (2, 1)</text>
<text x="568" y="175" style="fill:#182b3e;font-size:18px;font-weight:400" text-anchor="start">M = (2×2+1)(2×1+1) = 15</text>
<text x="568" y="202" style="fill:#182b3e;font-size:18px;font-weight:400" text-anchor="start">result.T.shape = (3, 5)</text>
<text x="568" y="229" style="fill:#182b3e;font-size:18px;font-weight:400" text-anchor="start">result.order(m, n)으로 직접 접근</text>
<text x="30" y="383" style="fill:#546779;font-size:16px;font-weight:400" text-anchor="start">각 칸은 회절차수 (m,n) · 전파하는 차수와 감쇠하는 차수를 함께 유지</text>
