<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" role="img" aria-labelledby="title desc">
<title id="title">x/y 차수와 결과 배열의 축</title><desc id="desc">truncation_order는 x가 먼저지만 결과 배열은 y 행, x 열이다.</desc>
