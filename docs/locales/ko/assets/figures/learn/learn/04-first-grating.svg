<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" role="img" aria-labelledby="04-first-grating-title 04-first-grating-desc">
<title id="04-first-grating-title">첫 예제의 실제 입력 구조</title><desc id="04-first-grating-desc">공기와 고굴절률이 반씩인 한 층, 유리 기판</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#546779"/></marker></defs>
<style>text{font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;fill:#182b3e;font-size:20px} .small{font-size:17px;fill:#546779}.formula{font-family:ui-monospace,SFMono-Regular,monospace;font-size:23px}</style>
<rect width="1000" height="420" fill="white"/>
<text x="30" y="37" style="fill:#182b3e;font-size:24px;font-weight:650" text-anchor="start">첫 예제의 실제 입력 구조</text>
<rect x="65" y="180" width="120" height="140" rx="0" fill="#ffffff" stroke="#285ab0" stroke-width="2"/>
<rect x="185" y="180" width="120" height="140" rx="0" fill="#ffffff" stroke="#285ab0" stroke-width="2"/>
<rect x="305" y="180" width="120" height="140" rx="0" fill="#e8f1ff" stroke="#285ab0" stroke-width="2"/>
<rect x="425" y="180" width="120" height="140" rx="0" fill="#e8f1ff" stroke="#285ab0" stroke-width="2"/>
<text x="74" y="153" style="fill:#182b3e;font-size:22px;font-weight:400" text-anchor="start">top = 1 (공기)</text>
<text x="92" y="257" style="fill:#182b3e;font-size:24px;font-weight:400" text-anchor="start">ε = 1</text>
<text x="351" y="257" style="fill:#182b3e;font-size:23px;font-weight:400" text-anchor="start">ε = 12.25</text>
<rect x="65" y="320" width="480" height="45" rx="0" fill="#e5f4ef" stroke="#cad7df" stroke-width="2"/>
<text x="158" y="350" style="fill:#182b3e;font-size:22px;font-weight:400" text-anchor="start">bot = 2.25 (유리)</text>
<line x1="306" y1="75" x2="306" y2="160" stroke="#285ab0" stroke-width="4"/>
<polygon points="306,160 302.0,150.0 310.0,150.0" fill="#285ab0"/>
<text x="337" y="106" style="fill:#182b3e;font-size:23px;font-weight:400" text-anchor="start">λ = 900 nm</text>
<line x1="65" y1="385" x2="545" y2="385" stroke="#546779" stroke-width="2"/>
<polygon points="545,385 535.0,389.0 535.0,381.0" fill="#546779"/>
<text x="248" y="379" style="fill:#182b3e;font-size:20px;font-weight:400" text-anchor="start">700 nm</text>
<line x1="567" y1="180" x2="567" y2="320" stroke="#546779" stroke-width="2"/>
<polygon points="567,320 563.0,310.0 571.0,310.0" fill="#546779"/>
<text x="584" y="263" style="fill:#182b3e;font-size:20px;font-weight:400" text-anchor="start">300 nm</text>
<rect x="722" y="180" width="238" height="155" rx="10" fill="#fff1df" stroke="#cad7df" stroke-width="2"/>
<text x="740" y="214" style="fill:#182b3e;font-size:22px;font-weight:650" text-anchor="start">TE 입사</text>
<text x="740" y="250" style="fill:#182b3e;font-size:18px;font-weight:400" text-anchor="start">E는 y 방향</text>
<text x="740" y="277" style="fill:#182b3e;font-size:18px;font-weight:400" text-anchor="start">Nx = 10, Ny = 0</text>
<text x="740" y="304" style="fill:#182b3e;font-size:18px;font-weight:400" text-anchor="start">배열 (1, 1, 4)</text>
<text x="30" y="403" style="fill:#546779;font-size:16px;font-weight:400" text-anchor="start">단면 개념도 · 예제 01의 입력값과 대응; 그림에서 층 두께 비율은 설명용</text>
</svg>