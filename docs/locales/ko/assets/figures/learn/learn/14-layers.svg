<rect x="35" y="272" width="235" height="72" rx="10" fill="#fff1df" stroke="#cad7df" stroke-width="2"/>
<text x="53" y="306" style="fill:#182b3e;font-size:22px;font-weight:650" text-anchor="start">층 0의 모드</text>
<line x1="280" y1="210" x2="359" y2="141" stroke="#546779" stroke-width="2"/>
<polygon points="359,141 354.0996477575976,150.59096178182259 348.83701266458957,144.56562595069747" fill="#546779"/>
<line x1="280" y1="210" x2="359" y2="312" stroke="#546779" stroke-width="2"/>
<polygon points="359,312 349.71429423085567,306.54329143449286 356.0391155226936,301.6446553359125" fill="#546779"/>
<rect x="380" y="83" width="320" height="135" rx="10" fill="#e8f1ff" stroke="#cad7df" stroke-width="2"/>
<text x="398" y="117" style="fill:#182b3e;font-size:22px;font-weight:650" text-anchor="start">ETM · 기본값</text>
<text x="398" y="153" style="fill:#182b3e;font-size:18px;font-weight:400" text-anchor="start">주어진 입사 응답 계산</text>
<text x="398" y="180" style="fill:#182b3e;font-size:18px;font-weight:400" text-anchor="start">안정화된 층 연결</text>
<rect x="380" y="253" width="320" height="135" rx="10" fill="#e5f4ef" stroke="#cad7df" stroke-width="2"/>
<text x="398" y="287" style="fill:#182b3e;font-size:22px;font-weight:650" text-anchor="start">SMM</text>
<text x="398" y="323" style="fill:#182b3e;font-size:18px;font-weight:400" text-anchor="start">입사 ↔ 출사 산란행렬</text>
<text x="398" y="350" style="fill:#182b3e;font-size:18px;font-weight:400" text-anchor="start">포트 정보를 가지고 연결</text>
