<text x="798" y="233" style="fill:#182b3e;font-size:18px;font-weight:400" text-anchor="start">같은 물리 문제</text>
<text x="30" y="418" style="fill:#546779;font-size:16px;font-weight:400" text-anchor="start">개념도 · ETM/SMM 일치는 연결 방법 확인; 독립된 물리 기준을 대신하지 않는다</text>
