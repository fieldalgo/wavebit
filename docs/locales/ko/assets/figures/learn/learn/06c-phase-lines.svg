<text x="200.0" y="450.0" style="fill:#285ab0;font-size:24px;font-weight:650" text-anchor="middle">a₁</text>
<text x="71.0" y="316.0" style="fill:#117c77;font-size:24px;font-weight:650" text-anchor="middle">a₂</text>
<line x1="200.0" y1="319.0" x2="332.0" y2="319.0" stroke="#a85116" stroke-width="4"/>
<polygon points="332.0,319.0 322.0,323.0 322.0,315.0" fill="#a85116"/>
<circle cx="200.0" cy="319.0" r="3" fill="#a85116"/>
<text x="343.0" y="312.0" style="fill:#a85116;font-size:25px;font-weight:700" text-anchor="start">b₁</text>
<line x1="200.0" y1="307.0" x2="212.0" y2="307.0" stroke="#a85116" stroke-width="1.5"/>
<line x1="212.0" y1="307.0" x2="212.0" y2="319.0" stroke="#a85116" stroke-width="1.5"/>
<text x="49" y="491" style="fill:#182b3e;font-size:20px;font-weight:400" text-anchor="start">a₂를 따라가는 동안 → 위상 그대로</text>
<text x="49" y="526" style="fill:#182b3e;font-size:20px;font-weight:400" text-anchor="start">a₁ 한 칸을 따라가면 → 한 주기(2π)</text>
<rect x="45" y="551" width="420" height="60" rx="8" fill="#fff1df" stroke="#cad7df" stroke-width="2"/>
<text x="65" y="589" style="fill:#a85116;font-size:23px;font-weight:650" text-anchor="start">b₁은 오른쪽(+x)</text>
<rect x="515" y="112" width="460" height="522" rx="12" fill="#ffffff" stroke="#cad7df" stroke-width="2"/>
<text x="539" y="151" style="fill:#182b3e;font-size:24px;font-weight:650" text-anchor="start">② 사선 셀 · 60°</text>
<text x="539" y="185" style="fill:#546779;font-size:19px;font-weight:400" text-anchor="start">위상: 한 번의 진동에서 지금 어느 단계인가</text>
