<circle cx="740.0" cy="332.39745962155615" r="3" fill="#a85116"/>
<text x="863.8416327411747" y="391.39745962155615" style="fill:#a85116;font-size:25px;font-weight:700" text-anchor="start">b₁</text>
<line x1="746.0" y1="322.0051547761429" x2="756.3923048454133" y2="328.0051547761429" stroke="#a85116" stroke-width="1.5"/>
<line x1="756.3923048454133" y1="328.0051547761429" x2="750.3923048454133" y2="338.39745962155615" stroke="#a85116" stroke-width="1.5"/>
<text x="539" y="491" style="fill:#182b3e;font-size:20px;font-weight:400" text-anchor="start">a₂를 따라가는 동안 → 위상 그대로</text>
<text x="539" y="526" style="fill:#182b3e;font-size:20px;font-weight:400" text-anchor="start">a₁ 한 칸을 따라가면 → 한 주기(2π)</text>
<rect x="535" y="551" width="420" height="60" rx="8" fill="#fff1df" stroke="#cad7df" stroke-width="2"/>
<text x="555" y="589" style="fill:#a85116;font-size:23px;font-weight:650" text-anchor="start">b₁은 오른쪽 아래(−30°)</text>
<text x="30" y="674" style="fill:#182b3e;font-size:22px;font-weight:650" text-anchor="start">셀을 따라 움직이는 방향(a₁)과, 위상 선에 수직인 방향(b₁)을 구분합니다.</text>
<text x="30" y="693" style="fill:#546779;font-size:16px;font-weight:400" text-anchor="start">선은 재료 경계가 아니라 (1,0) 푸리에 성분의 같은 위상 선 · +x는 오른쪽, +y는 위쪽</text>
