<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 710" role="img" aria-labelledby="06c-phase-lines-title 06c-phase-lines-desc">
<title id="06c-phase-lines-title">b₁은 왜 a₂와 수직일까?</title><desc id="06c-phase-lines-desc">(1,0) 푸리에 성분의 같은 위상 선은 a2와 나란하다. 직교 셀에서는 세로선이어서 b1이 오른쪽을 향하고, 60도 셀에서는 선이 기울어 b1이 오른쪽 아래를 향한다.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#546779"/></marker></defs>
<style>text{font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;fill:#182b3e;font-size:20px} .small{font-size:17px;fill:#546779}.formula{font-family:ui-monospace,SFMono-Regular,monospace;font-size:23px}</style>
<rect width="1000" height="710" fill="white"/>
<text x="30" y="37" style="fill:#182b3e;font-size:24px;font-weight:650" text-anchor="start">b₁은 왜 a₂와 수직일까?</text>
<text x="30" y="82" style="fill:#182b3e;font-size:22px;font-weight:400" text-anchor="start">각 선 위에서는 위상이 같음 · 두 그림 모두 실제 xy 평면</text>
<rect x="25" y="112" width="460" height="522" rx="12" fill="#ffffff" stroke="#cad7df" stroke-width="2"/>
<text x="49" y="151" style="fill:#182b3e;font-size:24px;font-weight:650" text-anchor="start">① 직교 셀 · 90°</text>
<text x="49" y="185" style="fill:#546779;font-size:19px;font-weight:400" text-anchor="start">위상: 한 번의 진동에서 지금 어느 단계인가</text>
<polygon points="100.0000,419.0000 300.0000,419.0000 300.0000,219.0000 100.0000,219.0000" fill="#e8f1ff" stroke="#cad7df" stroke-width="1.5"/>
<line x1="100.0" y1="431.0" x2="100.00000000000001" y2="207.0" stroke="#546779" stroke-width="1.6"/>
