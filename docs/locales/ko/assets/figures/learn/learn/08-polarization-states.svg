<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 630" role="img" aria-labelledby="title desc">
<title id="title">편광: 한 위치에서 전기장 끝점이 그리는 모양</title><desc id="desc">s 성분을 가로축, p 성분을 세로축으로 펼쳐 선편광, 원편광, 타원편광을 비교한다. 그림은 무손실 등방성 입사 매질의 정규화된 전기장이다.</desc>
