<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 345" role="img" aria-labelledby="15-backends-title 15-backends-desc">
<title id="15-backends-title">물리 코어는 공유하고 배열 도구를 고른다</title><desc id="15-backends-desc">공통 솔버와 세 어댑터, 백엔드별 자동미분</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#546779"/></marker></defs>
<style>text{font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;fill:#182b3e;font-size:20px} .small{font-size:17px;fill:#546779}.formula{font-family:ui-monospace,SFMono-Regular,monospace;font-size:23px}</style>
<rect width="1000" height="345" fill="white"/>
<text x="30" y="37" style="fill:#182b3e;font-size:24px;font-weight:650" text-anchor="start">물리 코어는 공유하고 배열 도구를 고른다</text>
<rect x="50" y="73" width="900" height="90" rx="10" fill="#e8f1ff" stroke="#cad7df" stroke-width="2"/>
<text x="68" y="107" style="fill:#182b3e;font-size:22px;font-weight:650" text-anchor="start">공통 코어: 기하학 → 구성 행렬 → 모드 → 층 연결 → 결과</text>
<line x1="190" y1="167" x2="190" y2="204" stroke="#546779" stroke-width="2"/>
<polygon points="190,204 186.0,194.0 194.0,194.0" fill="#546779"/>
<rect x="50" y="215" width="280" height="78" rx="10" fill="#f1f5f7" stroke="#cad7df" stroke-width="2"/>
<text x="68" y="249" style="fill:#182b3e;font-size:22px;font-weight:650" text-anchor="start">NumPy · 0</text>
<text x="68" y="285" style="fill:#182b3e;font-size:18px;font-weight:400" text-anchor="start">일반 계산</text>
<line x1="500" y1="167" x2="500" y2="204" stroke="#546779" stroke-width="2"/>
<polygon points="500,204 496.0,194.0 504.0,194.0" fill="#546779"/>
<rect x="360" y="215" width="280" height="78" rx="10" fill="#e5f4ef" stroke="#cad7df" stroke-width="2"/>
<text x="378" y="249" style="fill:#182b3e;font-size:22px;font-weight:650" text-anchor="start">JAX · 1</text>
<text x="378" y="285" style="fill:#182b3e;font-size:18px;font-weight:400" text-anchor="start">자동미분 · 지원 경로 JIT</text>
<line x1="810" y1="167" x2="810" y2="204" stroke="#546779" stroke-width="2"/>
<polygon points="810,204 806.0,194.0 814.0,194.0" fill="#546779"/>
<rect x="670" y="215" width="280" height="78" rx="10" fill="#fff1df" stroke="#cad7df" stroke-width="2"/>
<text x="688" y="249" style="fill:#182b3e;font-size:22px;font-weight:650" text-anchor="start">PyTorch · 2</text>
<text x="688" y="285" style="fill:#182b3e;font-size:18px;font-weight:400" text-anchor="start">eager 자동미분</text>
<text x="30" y="328" style="fill:#546779;font-size:16px;font-weight:400" text-anchor="start">별도 실험 보조 계열에는 NumPy 전용 등 더 좁은 지원 범위가 있다</text>
