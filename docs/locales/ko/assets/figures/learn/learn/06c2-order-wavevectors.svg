<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 630" role="img" aria-labelledby="06c-reciprocal-title 06c-reciprocal-desc">
<title id="06c-reciprocal-title">(1,0)차는 b₁을 한 번 더하는 차수</title><desc id="06c-reciprocal-desc">60도 격자에서 (1,0)차에 해당하는 횡파수 차이는 b1이다. x 성분은 양수 g, y 성분은 음수 마이너스 g 나누기 루트 3이다. 오른쪽은 실제 위치가 아니라 파수 차이 좌표다.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#546779"/></marker></defs>
<style>text{font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;fill:#182b3e;font-size:20px} .small{font-size:17px;fill:#546779}.formula{font-family:ui-monospace,SFMono-Regular,monospace;font-size:23px}</style>
<rect width="1000" height="630" fill="white"/>
<text x="30" y="37" style="fill:#182b3e;font-size:24px;font-weight:650" text-anchor="start">(1,0)차는 b₁을 한 번 더하는 차수</text>
<text x="30" y="82" style="fill:#182b3e;font-size:23px;font-weight:650" text-anchor="start">차수 번호 (m, n) = b₁과 b₂를 각각 몇 번 더하는가</text>
<rect x="25" y="115" width="430" height="388" rx="12" fill="#ffffff" stroke="#cad7df" stroke-width="2"/>
<text x="49" y="156" style="fill:#182b3e;font-size:25px;font-weight:650" text-anchor="start">예: result.order(1, 0)</text>
<text x="49" y="207" style="fill:#a85116;font-size:26px;font-weight:650" text-anchor="start">Δk∥ = 1 × b₁ + 0 × b₂</text>
<text x="49" y="257" style="fill:#182b3e;font-size:20px;font-weight:400" text-anchor="start">60° 셀 · 두 변의 길이 600 nm</text>
<text x="49" y="301" style="fill:#182b3e;font-size:24px;font-weight:400" text-anchor="start">b₁ = g (1, −1/√3)</text>
<text x="49" y="346" style="fill:#285ab0;font-size:23px;font-weight:400" text-anchor="start">x 성분:  +g</text>
<text x="49" y="383" style="fill:#a85116;font-size:23px;font-weight:400" text-anchor="start">y 성분:  −g/√3</text>
<text x="49" y="436" style="fill:#546779;font-size:20px;font-weight:400" text-anchor="start">g = (2π/600) nm⁻¹</text>
<text x="49" y="475" style="fill:#182b3e;font-size:20px;font-weight:650" text-anchor="start">(1,0)차도 x·y 성분이 함께 바뀝니다.</text>
<text x="530" y="139" style="fill:#182b3e;font-size:20px;font-weight:650" text-anchor="start">여기는 위치가 아닌 파수 차이 좌표</text>
<line x1="535" y1="336.0" x2="943" y2="336.0" stroke="#cad7df" stroke-width="2"/>
<polygon points="943,336.0 933.0,340.0 933.0,332.0" fill="#cad7df"/>
<line x1="663.0" y1="466" x2="663.0" y2="161" stroke="#cad7df" stroke-width="2"/>
<polygon points="663.0,161 667.0,171.0 659.0,171.0" fill="#cad7df"/>
<text x="893" y="319.0" style="fill:#546779;font-size:22px;font-weight:400" text-anchor="start">Δkₓ</text>
<text x="610" y="174" style="fill:#546779;font-size:22px;font-weight:400" text-anchor="start">Δkᵧ</text>
<line x1="802.0" y1="336.0" x2="802.0" y2="416.25168741735797" stroke="#546779" stroke-width="1.3" stroke-dasharray="7 5"/>
<line x1="663.0" y1="416.25168741735797" x2="802.0" y2="416.25168741735797" stroke="#546779" stroke-width="1.3" stroke-dasharray="7 5"/>
<line x1="663.0" y1="336.0" x2="663.0" y2="175.49662516528403" stroke="#117c77" stroke-width="4"/>
<polygon points="663.0,175.49662516528403 667.0,185.49662516528403 659.0,185.49662516528403" fill="#117c77"/>
<line x1="663.0" y1="336.0" x2="802.0" y2="416.25168741735797" stroke="#a85116" stroke-width="4"/>
<polygon points="802.0,416.25168741735797 791.3397459621556,414.7157890324957 795.3397459621556,407.78758580222024" fill="#a85116"/>
<circle cx="663.0" cy="336.0" r="5" fill="#546779"/>
<circle cx="802.0" cy="416.25168741735797" r="5" fill="#a85116"/>
<circle cx="663.0" cy="175.49662516528403" r="5" fill="#117c77"/>
<text x="584.0" y="365.0" style="fill:#182b3e;font-size:22px;font-weight:400" text-anchor="start">(0,0)</text>
<text x="679.0" y="184.49662516528403" style="fill:#117c77;font-size:22px;font-weight:400" text-anchor="start">b₂ · (0,1)차</text>
<text x="814.0" y="430.25168741735797" style="fill:#a85116;font-size:22px;font-weight:650" text-anchor="start">(1,0)차</text>
<text x="740.0" y="405.0" style="fill:#a85116;font-size:25px;font-weight:650" text-anchor="start">b₁</text>
<text x="728.0" y="322.0" style="fill:#285ab0;font-size:20px;font-weight:400" text-anchor="start">+g</text>
<text x="816.0" y="375.0" style="fill:#546779;font-size:20px;font-weight:400" text-anchor="start">−g/√3</text>
<path d="M711.0,336.0 A48 48 0 0 1 704.569219381653,360.0" fill="none" stroke="#a85116" stroke-width="1.5"/>
<text x="715.0" y="363.0" style="fill:#a85116;font-size:17px;font-weight:400" text-anchor="start">−30°</text>
<rect x="25" y="527" width="950" height="66" rx="10" fill="#e5f4ef" stroke="#cad7df" stroke-width="2"/>
<text x="48" y="568" style="fill:#182b3e;font-size:23px;font-weight:650" text-anchor="start">실제 횡파수 = 입사파의 횡파수 + 차수에 따라 더하는 Δk∥</text>
<text x="30" y="613" style="fill:#546779;font-size:16px;font-weight:400" text-anchor="start">화살표는 차수 사이의 파수 차이 · 실제 회절파의 출사 방향은 입사 조건과 전파 가능 여부까지 확인</text>
</svg>