<text x="61" y="456" style="fill:#182b3e;font-size:22px;font-weight:650" text-anchor="start">P = ¼a₁ + ¼a₂</text>
<text x="61" y="492" style="fill:#182b3e;font-size:18px;font-weight:400" text-anchor="start">a₁ = (600, 0) nm</text>
<text x="61" y="519" style="fill:#182b3e;font-size:18px;font-weight:400" text-anchor="start">a₂ = (0, 600) nm</text>
<text x="250" y="594" style="fill:#a85116;font-size:25px;font-weight:650" text-anchor="middle">P = (150, 150) nm</text>
<text x="745" y="126" style="fill:#182b3e;font-size:23px;font-weight:650" text-anchor="middle">② 사잇각 α = 60°</text>
