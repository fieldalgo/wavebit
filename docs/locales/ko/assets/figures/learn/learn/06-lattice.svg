<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 635" role="img" aria-labelledby="06-lattice-title 06-lattice-desc">
<title id="06-lattice-title">같은 (u, v), 달라지는 실제 위치 (x, y)</title><desc id="06-lattice-desc">600 nm 격자의 사잇각을 90도에서 60도로 바꾸면 같은 격자 좌표 0.75,0.75가 150,150에서 225,129.9 nm로 이동한다.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#546779"/></marker></defs>
<style>text{font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;fill:#182b3e;font-size:20px} .small{font-size:17px;fill:#546779}.formula{font-family:ui-monospace,SFMono-Regular,monospace;font-size:23px}</style>
<rect width="1000" height="635" fill="white"/>
<text x="30" y="37" style="fill:#182b3e;font-size:24px;font-weight:650" text-anchor="start">같은 (u, v), 달라지는 실제 위치 (x, y)</text>
<text x="30" y="81" style="fill:#182b3e;font-size:21px;font-weight:400" text-anchor="start">두 변의 길이는 모두 600 nm · P의 격자 좌표는 계속 (0.75, 0.75)</text>
<text x="250" y="126" style="fill:#182b3e;font-size:23px;font-weight:650" text-anchor="middle">① 사잇각 α = 90°</text>
