<text x="822.0" y="270.18430139592795" style="fill:#117c77;font-size:18px;font-weight:400" text-anchor="start">¼a₂</text>
<circle cx="827.5" cy="232.3686027918559" r="7" fill="#a85116"/>
<text x="840.5" y="220.3686027918559" style="fill:#a85116;font-size:22px;font-weight:700" text-anchor="start">P</text>
<rect x="538" y="422" width="414" height="140" rx="10" fill="#e5f4ef" stroke="#cad7df" stroke-width="2"/>
<text x="556" y="456" style="fill:#182b3e;font-size:22px;font-weight:650" text-anchor="start">P = ¼a₁ + ¼a₂</text>
<text x="556" y="492" style="fill:#182b3e;font-size:18px;font-weight:400" text-anchor="start">a₁ = (600, 0) nm</text>
<text x="556" y="519" style="fill:#182b3e;font-size:18px;font-weight:400" text-anchor="start">a₂ ≈ (300, 519.6) nm</text>
<text x="745" y="594" style="fill:#a85116;font-size:25px;font-weight:650" text-anchor="middle">P ≈ (225, 129.9) nm</text>
<text x="30" y="618" style="fill:#546779;font-size:16px;font-weight:400" text-anchor="start">기하학 계산 · O는 셀 중심: (u, v)=(0.5, 0.5), (x, y)=(0, 0) · 광학 계산 결과가 아님</text>
