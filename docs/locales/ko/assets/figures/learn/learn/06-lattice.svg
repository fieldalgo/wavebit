<text x="230" y="307" style="fill:#182b3e;font-size:19px;font-weight:400" text-anchor="start">O</text>
<text x="261" y="307" style="fill:#285ab0;font-size:18px;font-weight:400" text-anchor="start">¼a₁</text>
<text x="327.0" y="266.5" style="fill:#117c77;font-size:18px;font-weight:400" text-anchor="start">¼a₂</text>
<circle cx="305.0" cy="225.0" r="7" fill="#a85116"/>
