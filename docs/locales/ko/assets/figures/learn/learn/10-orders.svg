<text x="150" y="341" style="fill:#182b3e;font-size:19px;font-weight:400" text-anchor="start">그림의 위쪽은 +n 방향</text>
<rect x="600" y="91" width="345" height="167" rx="10" fill="#e5f4ef" stroke="#cad7df" stroke-width="2"/>
<text x="618" y="125" style="fill:#182b3e;font-size:22px;font-weight:650" text-anchor="start">배열에서는 v 차수가 행</text>
<text x="618" y="161" style="fill:#182b3e;font-size:18px;font-weight:400" text-anchor="start">orders_v = [−1, 0, 1]</text>
<text x="618" y="188" style="fill:#182b3e;font-size:18px;font-weight:400" text-anchor="start">orders_u = [−2, −1, 0, 1, 2]</text>
<text x="618" y="215" style="fill:#182b3e;font-size:18px;font-weight:400" text-anchor="start">R.shape = (3, 5)</text>
<text x="600" y="319" style="fill:#182b3e;font-size:21px;font-weight:400" text-anchor="start">order(m, n)으로 직접 읽기</text>
<text x="30" y="373" style="fill:#546779;font-size:16px;font-weight:400" text-anchor="start">기본 0차 단일 입사 · 그림의 기하학적 위/아래와 배열 행 증가 방향을 구별</text>
</svg>