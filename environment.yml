# Development environment for FieldWave.
#
#   conda env create -f environment.yml   # run from the repo root: pip's "-e ." is relative
#   conda activate fieldwave
#
# Only Python and the notebook stack come from conda; the scientific stack is
# installed with pip, matching how the working env on this machine is built.
# The dependency floors live in setup.py and are not duplicated here.
# Last verified 2026-08-04 on macOS arm64.
name: fieldwave
channels:
  - defaults
dependencies:
  - python=3.12
  - pip
  - jupyterlab
  - notebook
  - pip:
      - matplotlib>=3.10
      - pytest>=9.1
      # FieldWave itself, editable. This also pulls the core runtime
      # dependencies (numpy, scipy, array-api-compat) at the floors declared in
      # setup.py, so they are deliberately not repeated here.
      - -e .[jax,pytorch]
      # Bridge to Octave, for the Reticolo comparison in benchmarks/. It is the only
      # oracle here that validates diffraction orders -- the analytic multilayer
      # reference covers uniform layers only -- so it earns a place in the dev
      # environment. Needs Octave itself on PATH (brew install octave), and the
      # Reticolo sources, which are not redistributable and live outside this repo.
      - oct2py>=6.0
#
# Not declared here: upstream `meent` (pip install meent), installed by hand when
# cross-checking numpy results against the Reticolo-validated reference. No module
# in this repo imports it.
