# Development environment for Wavebit.
#
#   conda env create -f environment.yml   # run from the repo root: pip's "-e ." is relative
#   conda activate wavebit
#
# Only Python and the notebook stack come from conda; the scientific stack is
# installed with pip, matching how the working env on this machine is built.
# The dependency floors live in pyproject.toml and are not duplicated here.
# Last verified 2026-08-04 on macOS arm64.
name: wavebit
channels:
  - defaults
dependencies:
  - python=3.12
  - pip
  - jupyterlab
  - notebook
  - pip:
      - matplotlib>=3.10
      - pytest>=9.1
      # Wavebit itself, editable. This also pulls the core runtime
      # dependencies (numpy, scipy, array-api-compat) at the floors declared in
      # pyproject.toml, so they are deliberately not repeated here.
      - -e .[jax,pytorch]
      # Bridge to Octave, for the Reticolo comparison in tests/references/. It is the only
      # oracle here that validates diffraction orders -- the analytic multilayer
      # reference covers uniform layers only -- so it earns a place in the dev
      # environment. Needs Octave itself on PATH (brew install octave), and the
      # Reticolo sources, kept outside this repo by choice -- their licence
      # declarations are recorded in tests/references/README.md.
      - oct2py>=6.0
